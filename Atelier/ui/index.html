<style>
/* Layout: trilho de pedidos | mesa do pedido (ramos = visões, rodada nova grande, histórico ao lado) | Claude.
   Tema escuro neutro de propósito: é mesa de julgar imagem, o fundo não pode puxar a cor. */
:root{
  color-scheme: dark;
  --ground:#0b0b0c;
  --bg:#131415;
  --panel:#18191b;
  --raise:#1f2023;
  --well:#0e0f10;
  --line:#26282b;
  --line-2:#35383c;
  --fg:#ebe8e3;
  --fg-2:#aeaba5;
  --fg-3:#76746f;
  --accent:#e4b45c;
  --accent-ink:#1b1408;
  --gpt:#79c9a9;
  --gem:#8aaaf3;
  --flash:#9ed4e6;
  --claude:#e28c66;
  --sfx:#c39bf2;
  --bad:#e06a5c;
  --add:#a5d6a0;
  --del:#e3958c;
  --sel:#24262a;
  --font-ui:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --font-mark:"Barlow Condensed","Bahnschrift","Arial Narrow",sans-serif;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ground);color:var(--fg);font:13px/1.45 var(--font-ui);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
figure{margin:0}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--fg-3)}
.sp{flex:1}
kbd{font:500 10px var(--font-mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--fg-3);background:rgba(255,255,255,.03)}
svg.i{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* botões */
.primary,.ghost{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:7px;font-weight:500;white-space:nowrap}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:hover{filter:brightness(1.08)}
.primary kbd{border-color:rgba(0,0,0,.2);color:rgba(27,20,8,.65);background:rgba(0,0,0,.06)}
.ghost{color:var(--fg-2);border:1px solid var(--line-2)}
.ghost:hover,.ghost.on{color:var(--fg);background:var(--raise)}
[hidden]{display:none!important}
.sm{height:26px;padding:0 9px;font-size:12px;gap:6px}
.mini{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font-size:11.5px;background:rgba(255,255,255,.08);color:var(--fg)}
.mini:hover{background:rgba(255,255,255,.14)}
button:disabled{opacity:.4;cursor:default}

/* modelos */
.m-sfx{--mc:var(--sfx)} .m-gpt{--mc:var(--gpt)} .m-pro{--mc:var(--gem)} .m-flash{--mc:var(--flash)}
.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500;background:rgba(255,255,255,.055);color:var(--fg-2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--mc,var(--fg-3))}
.chip.ov{background:rgba(10,10,11,.62);color:#e9e6e1;backdrop-filter:blur(6px)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.dot.q{border:1.5px solid var(--fg-3)}
.dot.g{background:var(--mc);animation:pulse 1.1s ease-in-out infinite}
.dot.d{background:var(--mc)}
.dot.f{background:var(--bad)}
.dot.p{background:var(--accent);box-shadow:0 0 0 2px rgba(228,180,92,.25)}
.dot.live{background:#7ccf8c;box-shadow:0 0 0 3px rgba(124,207,140,.14)}
@keyframes pulse{50%{opacity:.25}}

/* janela */
.win{height:100%;display:grid;grid-template-rows:48px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);position:relative}
.top{display:flex;align-items:center;gap:16px;padding:0 12px 0 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.mark{display:inline-flex;align-items:center;gap:9px;font:600 17px/1 var(--font-mark);letter-spacing:.22em;text-transform:uppercase}
.mark::before{content:"";width:9px;height:9px;background:var(--accent);transform:rotate(45deg)}
.tag{font-size:10.5px;color:var(--fg-3);letter-spacing:.04em}
.meters{display:flex;gap:6px;min-width:0;overflow:hidden}
.meter{cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.035);color:var(--fg-3);font-size:11.5px;white-space:nowrap}
.meter b{font-weight:600;color:var(--fg-2)}
.meter.on{color:var(--fg-2)}
.top-actions{display:flex;gap:8px;margin-left:auto;flex:none}
.only-narrow{display:none}

.body{display:grid;grid-template-columns:276px minmax(0,1fr) 336px;min-height:0}
.body.no-claude{grid-template-columns:276px minmax(0,1fr)}
.body.no-claude .claude{display:none}

/* trilho */
.rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.rail-search{padding:10px 10px 4px}
.rail-search button{width:100%;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:7px;background:var(--well);border:1px solid var(--line);color:var(--fg-3);font-size:12px}
.rail-search button kbd{margin-left:auto}
#rail{flex:1;overflow:auto;padding:4px 6px 10px}
.grp{margin-top:10px}
.grp-h{display:flex;justify-content:space-between;padding:4px 8px 6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.req{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.req:hover{background:rgba(255,255,255,.035)}
.req.on{background:var(--sel)}
.mosaic{position:relative;width:54px;height:36px;border-radius:5px;overflow:hidden;background:var(--well);display:grid;grid-auto-flow:column;gap:1px;border:1px solid var(--line)}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block;min-width:0}
.mosaic.b4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;grid-auto-flow:row}
.req-t{min-width:0}
.req-t b{display:block;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-t span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden}
.req-t span svg{width:12px;height:12px}
.req-s{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:40px}
.unseen{min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 10px/16px var(--font-mono);text-align:center}
#sessions{border-top:1px solid var(--line);padding:10px 8px 12px}
.sess-h{padding:0 6px 6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.sess{display:flex;align-items:center;gap:8px;width:100%;height:26px;padding:0 6px;border-radius:6px;font-size:12px;color:var(--fg-2);text-align:left}
.sess:hover{background:rgba(255,255,255,.035)}
.sess.on{background:var(--sel);color:var(--fg)}
.sess span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget{margin:10px 6px 0;font-size:11.5px;color:var(--fg-3)}
.b-row{display:flex;justify-content:space-between;margin-bottom:5px}
.bbar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bbar i{display:block;height:100%;background:var(--fg-3)}

/* mesa */
.desk{overflow:auto;padding:18px 22px 48px;min-width:0}
.d-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.d-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 320px}
.d-title h1{font-size:19px;letter-spacing:-.005em}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600}
.pill.ok{background:rgba(228,180,92,.15);color:var(--accent)}
.d-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;order:3;margin-top:-8px;font-size:12px;color:var(--fg-3)}
.src{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2)}
.src svg{width:13px;height:13px}
.path{display:inline-flex;align-items:center;gap:6px;font:11.5px var(--font-mono);color:var(--fg-3);border-radius:5px;padding:2px 4px;margin:-2px -4px}
.path:hover{color:var(--fg);background:var(--raise)}
.path svg{width:13px;height:13px}
.d-acts{display:flex;gap:8px;flex:none}

.prompt{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:12px}
.prompt.dropping{border-color:var(--accent);border-style:dashed}
.p-text{font-size:13px;color:var(--fg-2);cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:110ch}
.prompt.open .p-text{display:block}
.p-text:hover{color:var(--fg)}
.atts{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.att{width:86px}
.att-img{position:relative;height:56px;border-radius:6px;overflow:hidden;background:var(--well);border:1px solid var(--line)}
.att-img img{width:100%;height:100%;object-fit:cover;display:block}
.att .n{position:absolute;left:4px;top:4px;min-width:16px;height:16px;border-radius:4px;background:rgba(10,10,11,.72);font:600 10px/16px var(--font-mono);text-align:center;color:#eee}
.att .anc{position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:4px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.att .anc svg{width:12px;height:12px;stroke-width:2}
.att .rm{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:5px;background:rgba(10,10,11,.78);color:#eee;display:grid;place-items:center;opacity:0;transition:opacity .12s}
.att .rm svg{width:12px;height:12px;stroke-width:2.2}
.att:hover .rm,.att .rm:focus-visible{opacity:1}
.att .rm:hover{background:var(--bad);color:#fff}
.att.root .att-img{border-color:rgba(228,180,92,.55)}
.att.derived .att-img{border:1px dashed var(--accent)}
.att figcaption{font-size:11px;color:var(--fg-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att.add{height:56px;border:1px dashed var(--line-2);border-radius:6px;display:grid;place-items:center;color:var(--fg-3)}
.att.add:hover{color:var(--fg);border-color:var(--fg-3)}

.ramo{margin-top:22px}
.ramo-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ramo-h h3{font-size:14px}
.slots{display:flex;gap:5px;flex-wrap:wrap}
.pdiff{display:inline-flex;gap:6px;align-items:center;font:11.5px var(--font-mono);color:var(--fg-3);padding:2px 6px;border-radius:5px}
.pdiff:hover{background:var(--raise);color:var(--fg-2)}
.pdiff .a{color:var(--add)} .pdiff .dl{color:var(--del)}
.praw{font-size:11.5px;color:var(--fg-3)}
.diffbox{margin:-2px 0 12px;padding:10px 12px;border-radius:8px;background:var(--well);border:1px solid var(--line);font:11.5px/1.6 var(--font-mono)}
.d-add{color:var(--add)} .d-add::before{content:"+ ";opacity:.7}
.d-del{color:var(--del);text-decoration:line-through;text-decoration-color:rgba(227,149,140,.5)} .d-del::before{content:"− ";opacity:.7}
.ramo-b{display:grid;grid-template-columns:minmax(0,1fr) 172px;gap:14px;align-items:start}
.ramo-b.solo{grid-template-columns:minmax(0,1fr)}
.latest{display:grid;grid-template-columns:repeat(var(--n),minmax(0,760px));gap:10px}
.hist{display:grid;gap:8px}
.h-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:center}
.h-row .mono{font-size:10.5px;color:var(--fg-3)}
.h-tiles{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.add-ramo{margin-top:22px;width:100%;height:46px;border:1px dashed var(--line-2);border-radius:10px;color:var(--fg-3);display:flex;align-items:center;justify-content:center;gap:8px}
.add-ramo:hover{color:var(--fg);border-color:var(--fg-3);background:rgba(255,255,255,.02)}

/* quadro (resultado) */
.tile{position:relative;aspect-ratio:16/10;border-radius:8px;background:var(--well);border:1px solid var(--line);overflow:hidden;cursor:pointer;max-width:100%}
.tile>img{width:100%;height:100%;object-fit:contain;display:block}
.tile>img.flip{transform:scaleX(-1)}
.tile.small{border-radius:5px}
.tile.small::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--mc)}
.tile.sel{outline:2px solid var(--fg);outline-offset:2px}
.tile.st-d,.atts .att-img{cursor:zoom-in}
.tile.pick{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.rej>img{opacity:.22;filter:grayscale(1)}
.lab{position:absolute;left:7px;top:7px;display:flex;gap:5px;align-items:center}
.rtag{font-size:10.5px;height:20px;line-height:20px;padding:0 6px;border-radius:5px;background:rgba(10,10,11,.62);color:#d9d6d1}
.tile.new .lab::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(10,10,11,.5)}
.star{position:absolute;left:7px;bottom:7px;width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.star svg{width:13px;height:13px;fill:currentColor;stroke:none}
.tile.small .star{width:15px;height:15px;left:3px;bottom:5px;border-radius:4px}
.tile.small .star svg{width:9px;height:9px}
.acts{position:absolute;right:6px;top:6px;display:flex;gap:4px;opacity:0;transform:translateY(-2px);transition:.12s}
.acts button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:rgba(10,10,11,.66);color:#e9e6e1;backdrop-filter:blur(6px)}
.acts button:hover{background:rgba(40,40,44,.9)}
.acts button.on{color:var(--accent)}
.tile:hover .acts,.tile.sel .acts{opacity:1;transform:none}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:14px 9px 6px;font-size:10.5px;color:#d6d3cd;background:linear-gradient(transparent,rgba(0,0,0,.62));opacity:0;transition:.12s}
.tile:hover .foot,.tile.sel .foot{opacity:1}
/* estados */
.tile.st-q{border-style:dashed;border-color:var(--line-2);background:transparent;display:grid;place-items:center}
.qpos{font-size:11px;color:var(--fg-3)}
.tile.st-g{display:grid;place-items:center}
.tile.st-g>img.dev{position:absolute;inset:0;opacity:0;filter:blur(18px) saturate(.6) brightness(.85);transform:scale(1.04);transition:filter .5s,opacity .5s}
.tile.st-g[data-ph="1"]>img.dev{opacity:1;filter:blur(16px) saturate(.6) brightness(.8)}
.tile.st-g[data-ph="2"]>img.dev{opacity:1;filter:blur(8px) saturate(.8) brightness(.9)}
.tile.st-g[data-ph="3"]>img.dev{opacity:1;filter:blur(3px) saturate(.95)}
.shim{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.055) 50%,transparent 70%) 0 0/250% 100%;animation:shim 1.6s linear infinite}
.tile.st-g[data-ph="2"] .shim,.tile.st-g[data-ph="3"] .shim{display:none}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.clock{position:relative;font-size:12px;color:#d9d6d1;padding:3px 8px;border-radius:6px;background:rgba(10,10,11,.5)}
.tile.small .clock{font-size:9.5px;padding:1px 4px}
.prog{position:absolute;left:0;bottom:0;height:2px;width:calc(var(--p,0)*100%);background:var(--mc);transition:width .2s linear}
.tile.st-f{background:color-mix(in srgb,var(--bad) 9%,var(--well));border-color:color-mix(in srgb,var(--bad) 35%,var(--line));display:grid;place-content:center;justify-items:center;gap:8px;padding:34px 10px 10px;text-align:center}
.err{font-size:12px;color:var(--del)}
.tile.small.st-f .err,.tile.small.st-f .mini{display:none}

/* lote */
.b-head{display:flex;align-items:center;gap:12px;margin-top:22px;margin-bottom:12px;flex-wrap:wrap}
.b-head .bbar{flex:1 1 160px;height:4px}
.b-head .bbar i{background:var(--fg-2)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px}
.bname{font-size:12px;color:var(--fg-2);margin:0 2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bpair .tile{aspect-ratio:1}
.bpair .lab{left:4px;top:4px}
.bpair .chip.ov{height:16px;padding:0 5px;font-size:9.5px}
.bpair .acts{right:3px;top:auto;bottom:3px}
.bpair .acts button{width:22px;height:22px}
.bpair .tile>img.alt{filter:saturate(.75) contrast(1.12) hue-rotate(12deg)}

/* Claude */
.claude{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
#cl-head{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.cl-title{display:flex;align-items:center;gap:8px;font-weight:600}
.spark{color:var(--claude);display:grid}
.cl-ctx{margin-top:3px;font-size:11.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cl-thread{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.msg{font-size:12.5px;line-height:1.55;color:var(--fg-2);max-width:100%}
.msg.me{align-self:flex-end;max-width:85%;background:var(--raise);color:var(--fg);padding:7px 11px;border-radius:10px 10px 3px 10px}
.sug{margin-top:10px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg);overflow:hidden}
.sug-h{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:11.5px;font-weight:600;color:var(--fg);border-bottom:1px solid var(--line)}
.sug .dl{padding:8px 11px;font:11px/1.6 var(--font-mono)}
.sug-acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 11px 10px}
.sug-done{display:flex;align-items:center;gap:6px;padding:0 11px 10px;font-size:11.5px;color:var(--fg-3)}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--fg-3);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
#cl-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
#cl-chips button{height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--line-2);font-size:11.5px;color:var(--fg-2)}
#cl-chips button:hover{color:var(--fg);background:var(--raise)}
#cl-compose{position:relative;padding:0 16px 14px}
#cl-input{width:100%;resize:none;min-height:62px;padding:9px 40px 9px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--well);color:var(--fg);font-size:12.5px;line-height:1.45}
#cl-input:focus{outline:none;border-color:var(--fg-3)}
#cl-send{position:absolute;right:24px;bottom:22px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--claude);color:#1d0f08}

/* som */
.tile.au{aspect-ratio:16/6;cursor:pointer}
.tile.au.st-d{background:color-mix(in srgb,var(--mc) 5%,var(--well))}
.tile.au .wave{position:absolute;left:10px;right:10px;top:30px;bottom:22px;width:calc(100% - 20px);height:calc(100% - 52px)}
.tile.au .ph{position:absolute;top:26px;bottom:18px;left:calc(10px + var(--pp,0) * (100% - 20px));width:2px;border-radius:1px;background:var(--fg);opacity:0;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.tile.au.playing .ph{opacity:1}
.tile.au.playing{border-color:var(--mc);box-shadow:inset 0 0 0 1px var(--mc)}
.tile.au .dur{position:absolute;left:9px;bottom:5px;font-size:10.5px;color:var(--fg-3)}
.tile.au .play{position:absolute;right:8px;bottom:5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--mc);color:#14101a}
.tile.au .play svg{width:12px;height:12px;fill:currentColor;stroke:none;margin-left:2px}
.tile.au.playing .play{opacity:.35}
.tile.small.au .wave{left:3px;right:3px;top:3px;bottom:5px;width:calc(100% - 6px);height:calc(100% - 8px)}
.tile.small.au .ph{top:2px;bottom:4px;left:calc(3px + var(--pp,0) * (100% - 6px))}
.bpair .tile.au{aspect-ratio:2/1}
.bpair .tile.au .wave{top:22px;bottom:6px;height:calc(100% - 28px)}
.mglyph{display:grid;place-items:center;width:100%;height:100%;color:var(--mc);background:color-mix(in srgb,var(--mc) 10%,var(--well))}
.mglyph svg{width:22px;height:22px}
.aparams{display:flex;gap:6px;flex-wrap:wrap}
.aparams .chip svg{width:12px;height:12px}
.aform{display:grid;gap:10px}
.arow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.arow input[type=range]{flex:1 1 160px;accent-color:var(--sfx)}
.arow .chk svg{width:14px;height:14px}
#nf-media{margin-left:10px}
#nf-media svg{width:13px;height:13px;margin-right:4px;vertical-align:-2px}
.ap-snds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ap-snds .chip svg{width:12px;height:12px}
.listen .au-list{display:grid;gap:8px;padding:14px;overflow:auto;align-content:start;min-height:0}
.au-row{display:grid;grid-template-columns:30px minmax(160px,240px) minmax(0,1fr) 34px;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;aspect-ratio:auto}
.au-row:hover{background:var(--raise)}
.au-row .n{width:24px;height:24px;border-radius:6px;background:var(--well);display:grid;place-items:center;font-size:12px;color:var(--fg-2)}
.au-row.playing .n{background:var(--mc);color:#14101a}
.au-l{display:grid;gap:4px;min-width:0}
.au-l b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au-l .dur{font-size:11px;color:var(--fg-3)}
.au-l .chip{justify-self:start}
.au-row .wv{position:relative;height:72px}
.au-row .wave{position:absolute;inset:0;width:100%;height:100%}
.au-row .ph{position:absolute;top:0;bottom:0;left:calc(var(--pp,0) * 100%);width:2px;background:var(--fg);opacity:0}
.au-row.playing .ph{opacity:1}
.au-row .pk{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg-3)}
.au-row .pk:hover{color:var(--fg);background:var(--sel)}
.au-row .pk.on{color:var(--accent)}
.au-row.pick{border-color:var(--accent)}

/* medidores com o uso de cada conta */
.meter{position:relative;overflow:hidden}
.meter.bad{color:var(--del)}
.meter.bad b{color:var(--del)}
.mbar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:1px;background:rgba(255,255,255,.08)}
.mbar>i{display:block;height:100%;border-radius:1px;background:var(--add)}
.mbar.mid>i{background:var(--accent)}
.mbar.hi>i{background:var(--bad)}

/* apagar e marcar vários */
.req{position:relative}
.req-x{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--fg-3);opacity:0;transition:opacity .12s}
.req-x svg{width:12px;height:12px}
.req:hover .req-x{opacity:1}
.req-x:hover{background:var(--bad);color:#fff}
.req.marked{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.multibar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;margin:6px 2px 4px;padding:7px 8px;border-radius:8px;background:var(--raise);border:1px solid var(--line-2);font-size:12px}
.multibar b{font-weight:600}
.mini.danger,.primary.danger{background:var(--bad);color:#fff}
.mini.danger svg{width:11px;height:11px}
.del-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

/* configurações */
.cfg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:grid;gap:10px}
.cfg-h{display:flex;align-items:center;gap:8px}
.cfg-h b{font-weight:600}
.cfg-h .sp{flex:1}
.cfg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cfg-row .inp{flex:1 1 220px;font-family:var(--font-mono);font-size:12.5px}
.cfg-st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2)}
.cfg-msg{font-size:12px;color:var(--fg-3);min-height:0}
.cfg-msg.ok{color:var(--add)} .cfg-msg.bad{color:var(--del)}
.cfg a{color:var(--fg-2)} .cfg a:hover{color:var(--fg)}
.cfg .dim{font-size:11.5px}

/* pasta do pedido */
.field.fpick{position:relative;display:flex;gap:8px;align-items:stretch}
.fp-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--well);text-align:left;color:var(--fg-2)}
.fp-btn:hover,.fp-btn:focus-visible{border-color:var(--fg-3);color:var(--fg)}
.fp-name{color:var(--fg);white-space:nowrap;font-weight:500}
.fp-path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--fg-3)}
.fpick>.ghost{height:38px}
.fp-pop{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:5;background:var(--raise);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.55);padding:8px;display:grid;gap:6px}
.fp-list{max-height:min(320px,46vh);overflow:auto;display:grid;gap:2px}
.fp-it{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 6px;border-radius:7px;text-align:left;color:var(--fg-2)}
.fp-it:hover,.fp-it.on{background:var(--sel);color:var(--fg)}
.fp-it img,.fp-it .ph{width:52px;height:32px;border-radius:4px;object-fit:cover;background:var(--well);display:grid;place-items:center;color:var(--fg-3)}
.fp-t{min-width:0}
.fp-t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.fp-t .m{display:block;font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-it>svg{color:var(--accent)}

/* camadas */
.overlay{position:absolute;inset:0;z-index:50;background:rgba(6,6,7,.7);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.sheet{width:min(600px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:18px 20px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.sheet h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.field{display:grid;gap:6px;margin-bottom:14px}
.flabel{font-size:11.5px;color:var(--fg-3)}
.inp,.ta,select.inp{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--well);color:var(--fg);font-size:13px}
.ta{resize:vertical;min-height:110px;line-height:1.5}
.inp:focus,.ta:focus{outline:none;border-color:var(--fg-3)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mname{display:flex;align-items:center;gap:8px;min-width:0}
.mname b{font-weight:500}
.mrow .mono{font-size:11px}
.step{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.step button{width:28px;height:26px;color:var(--fg-2)}
.step button:hover{background:var(--raise);color:var(--fg)}
.step b{min-width:24px;text-align:center;font:500 12px var(--font-mono)}
.step.zero b{color:var(--fg-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--fg-3)}
.seg button.on{background:var(--raise);color:var(--fg)}
.sheet-acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:6px;flex-wrap:wrap}
.drop{border:1px dashed var(--line-2);border-radius:8px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:64px}
.drop.over{border-color:var(--accent);background:rgba(228,180,92,.05)}
/* arrastando arquivo com o pedido novo aberto: a janela toda aceita */
body.dragging #ov.overlay::after{content:"";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;pointer-events:none}
.drop .att{width:72px}
.drop .att-img{height:46px}
.drop .hint{color:var(--fg-3);font-size:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);margin-bottom:8px}
.chk input{accent-color:var(--accent)}
.pathsel{display:flex;align-items:center;gap:2px;font-size:12.5px;color:var(--fg-3);padding:4px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--well)}
.pathsel select{border:0;background:transparent;color:var(--fg);font:inherit;padding:4px 2px;cursor:pointer}
.ap-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ap-imgs img{height:84px;border-radius:6px;border:1px solid var(--accent)}

.cmp,.loupe{position:absolute;inset:0;z-index:60;background:var(--ground);display:grid;grid-template-rows:auto minmax(0,1fr)}
.cmp-h,.lp-h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.cmp-grid{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;padding:10px;min-height:0}
.cc{position:relative;border-radius:8px;overflow:hidden;background:var(--well);border:1px solid var(--line);cursor:pointer;min-height:0;display:grid}
.cc img{width:100%;height:100%;display:block;object-fit:contain;min-height:0}
.cc.pick{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cc figcaption{position:absolute;left:8px;top:8px;display:flex;gap:6px;align-items:center;font-size:11.5px;color:#ddd}
.cc .n{width:20px;height:20px;border-radius:5px;background:rgba(10,10,11,.7);font:600 11px/20px var(--font-mono);text-align:center}
.cc.target{cursor:default;border-color:rgba(228,180,92,.45)}
.cc .lbl{background:rgba(10,10,11,.62);padding:2px 7px;border-radius:5px}
.slide{position:relative;margin:10px auto;max-width:100%;max-height:100%;overflow:hidden;border-radius:8px;cursor:ew-resize;align-self:center;user-select:none}
.slide img{display:block;max-width:100%;max-height:calc(100vh - 140px)}
.slide .b{position:absolute;inset:0;clip-path:inset(0 0 0 calc(var(--s,.5)*100%))}
.slide .b img{width:100%;height:100%;object-fit:contain}
.slide .bar{position:absolute;top:0;bottom:0;left:calc(var(--s,.5)*100%);width:2px;background:var(--fg);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.slide .sl{position:absolute;top:10px;display:flex;gap:6px}
.lp-body{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px;min-height:0}
.lp-body.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lp-body figure{position:relative;display:grid;place-items:center;min-height:0;background:var(--well);border-radius:8px;overflow:hidden}
.lp-body img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lp-body figcaption{position:absolute;left:10px;top:10px}

.pal{align-self:start;margin-top:8vh;width:min(560px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.pal input{width:100%;height:46px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:14px;color:var(--fg)}
.pal input:focus{outline:none}
.pal-list{max-height:50vh;overflow:auto;padding:6px}
.pal-it{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:7px;text-align:left;color:var(--fg-2)}
.pal-it.on,.pal-it:hover{background:var(--sel);color:var(--fg)}
.pal-it span:last-child{margin-left:auto;font-size:11px;color:var(--fg-3)}

.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:min(440px,calc(100vw - 64px));padding:9px 10px 9px 13px;border-radius:9px;background:#24262a;border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:12.5px;animation:tin .18s ease-out}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:1180px){
  .body{grid-template-columns:260px minmax(0,1fr)}
  .claude{position:absolute;right:0;top:48px;bottom:0;width:min(340px,92%);z-index:40;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  .body.no-claude .claude{display:none}
  .meters .meter:nth-child(n+3){display:none}
}
@media (max-width:820px){
  .body,.body.no-claude{grid-template-columns:minmax(0,1fr)}
  .rail{display:none;position:absolute;left:0;top:48px;bottom:0;width:min(300px,88%);z-index:45;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .body.show-rail .rail{display:flex}
  .only-narrow{display:inline-flex}
  .meters,.tag,.top-actions .t,.top-actions kbd{display:none}
  .top{gap:8px;padding:0 8px 0 12px}
  .ramo-b{grid-template-columns:minmax(0,1fr)}
  .hist{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .desk{padding:14px 12px 40px}
  .lp-body.two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .latest{grid-template-columns:minmax(0,1fr)}
  .top-actions .primary span{display:none}
  .brand .mark{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<div class="win" id="win">
  <header class="top">
    <div class="brand"><span class="mark">Atelier</span><span class="tag" id="conn"></span></div>
    <button class="ghost sm only-narrow" data-act="toggle-rail">Pedidos</button>
    <div class="meters" id="meters"></div>
    <div class="top-actions">
      <button class="ghost" data-act="settings" id="btn-settings" title="Configurações: chaves e por onde o GPT sai" data-ic="sliders"></button>
      <button class="ghost kb" data-act="claude-toggle" id="btn-claude" title="Mostrar ou esconder o Claude (/)"><span class="spark" data-ic="spark"></span><span class="t">Claude</span></button>
      <button class="primary" data-act="new" data-ic="plus"><span>Novo pedido</span><kbd>N</kbd></button>
    </div>
  </header>
  <div class="body" id="body">
    <aside class="rail">
      <div class="rail-search"><button data-act="palette" data-ic="search"><span>Buscar ou fazer</span><kbd>Ctrl K</kbd></button></div>
      <div id="rail"></div>
      <div id="sessions"></div>
    </aside>
    <main class="desk" id="desk"></main>
    <aside class="claude" id="claude">
      <div id="cl-head"></div>
      <div id="cl-thread"></div>
      <div id="cl-chips">
        <button data-act="chip">Outra visão</button>
        <button data-act="chip">Mais fiel à raiz</button>
        <button data-act="chip">Comparar com o alvo</button>
      </div>
      <form id="cl-compose" autocomplete="off">
        <textarea id="cl-input" rows="2" placeholder="Fale com o Claude sobre este pedido"></textarea>
        <button id="cl-send" type="submit" title="Enviar (Enter)" data-ic="send"></button>
      </form>
    </aside>
  </div>
  <div id="ov" hidden></div>
  <div class="toasts" id="toasts"></div>
  <input type="file" id="file-att" accept="image/*" multiple hidden>
</div>

<script src="app.js"></script>
</body>
</html>
