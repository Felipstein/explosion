<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A resposta ao selecionar</title>
<style>
  :root { --T: #59B2FF; --W: #F3F1EC; --D: #0B0E11; }
  html, body { margin: 0; background: #15171a; color: #e9e6df; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  .page { width: 1560px; padding: 16px 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a968c; margin: 0 0 10px; max-width: 1500px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .cell { width: 760px; }
  .cap { font-weight: 700; margin: 0 0 3px; }
  .note { color: #9a968c; font-size: 12.5px; margin: 3px 0 12px; }
  .fr { position: relative; width: 760px; height: 330px; overflow: hidden; border-radius: 6px; background: url(alerta_bg.jpg) -140px -150px / 1600px 900px; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
// (04/11, ele: "foi enviesado no ZH e não fez o que eu pedi? ver o que um RTS bom faria?") O estudo: os RTS bons respondem à seleção
// em três canais juntos: (1) uma marca que fica no selecionado pra dizer o QUÊ (o anel no chão: StarCraft II, Warcraft III, Age of
// Empires II/III/IV, Red Alert 3, Tempest Rising; os cantos: o C&C de 1995; o contorno: Age of Empires IV no que está atrás, Beyond All
// Reason); (2) a resposta no instante do clique: a voz da unidade é o canal mais forte em todos (StarCraft, Warcraft, Company of
// Heroes, Age of Empires, C&C), mais um estalo visual curto (o ZH pisca a unidade na cor do time); (3) o HUD que muda (o retrato, o
// cartão). O ZH tem só o clarão, a voz e a barra (o anel ele não tem); os nossos anéis saíram a pedido dele em 09/10.
// O fundo: a foto do jogo (alerta_bg.jpg, recortada a partir de 140, 150). Os alvos: os dois tanques e o Stryker.
const UNITS = [{ x: 325 - 140, y: 383 - 150, w: 84, h: 40, rot: -8 }, { x: 282 - 140, y: 238 - 150, w: 86, h: 40, rot: -8 }, { x: 605 - 140, y: 375 - 150, w: 62, h: 34, rot: 22 }];
const f = n => +n.toFixed(2);
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const LOOP = 2.0;
const T = /t=([\d.]+)/.exec(location.hash);
// A: o clarão do ZH (o que está no jogo agora): a luz na cor do time acende a unidade e apaga em 0,2 s
const flash = (u, t) => { const k = Math.pow(1 - Math.min(1, t / 0.2), 2); return k > 0.01 ? `<ellipse cx="${u.x}" cy="${u.y}" rx="${u.w * 0.75}" ry="${u.h * 0.95}" fill="url(#glow)" opacity="${f(k)}"/>` : ""; };
// B: os cantos do C&C (os mesmos do cursor de selecionar): fecham em volta da unidade num estalo e ficam
function corners(u, t) {
  const k = ease(t / 0.18), s = 1.35 - 0.35 * k, hw = u.w * 0.62 * s, hh = u.h * 0.75 * s, L = Math.min(hw, hh) * 0.42;
  let d = "";
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => { d += `M${f(u.x + sx * hw)} ${f(u.y + sy * (hh - L))}L${f(u.x + sx * hw)} ${f(u.y + sy * hh)}L${f(u.x + sx * (hw - L))} ${f(u.y + sy * hh)}`; });
  return `<path d="${d}" fill="none" stroke="var(--D)" stroke-width="5.2" stroke-linecap="square"/><path d="${d}" fill="none" stroke="var(--W)" stroke-width="2.4" stroke-linecap="square" opacity="${f(0.6 + 0.4 * k)}"/>`;
}
// C: o anel no chão na cor do time (StarCraft II, Age of Empires, Red Alert 3): nasce largo e assenta; deitado no chão (0,64)
function ring(u, t) {
  const k = ease(t / 0.2), s = 1.3 - 0.3 * k, rx = u.w * 0.72 * s, ry = rx * 0.5;
  return `<ellipse cx="${u.x}" cy="${f(u.y + u.h * 0.35)}" rx="${f(rx)}" ry="${f(ry)}" fill="none" stroke="var(--D)" stroke-width="5" opacity=".7"/>`
    + `<ellipse cx="${u.x}" cy="${f(u.y + u.h * 0.35)}" rx="${f(rx)}" ry="${f(ry)}" fill="none" stroke="var(--T)" stroke-width="2.4"/>`
    + (t < 0.3 ? `<ellipse cx="${u.x}" cy="${f(u.y + u.h * 0.35)}" rx="${f(rx)}" ry="${f(ry)}" fill="none" stroke="white" stroke-width="2.4" opacity="${f(1 - t / 0.3)}"/>` : "");
}
// D: o contorno na cor do time (o modo de hoje: Age of Empires IV, Beyond All Reason): a silhueta acende e fica fina
function outline(u, t) {
  const k = Math.pow(1 - Math.min(1, t / 0.25), 2);
  return `<g transform="rotate(${u.rot} ${u.x} ${u.y})"><rect x="${f(u.x - u.w * 0.55)}" y="${f(u.y - u.h * 0.5)}" width="${f(u.w * 1.1)}" height="${f(u.h)}" rx="${f(u.h * 0.35)}" fill="none" stroke="var(--T)" stroke-width="${f(2 + 3 * k)}" opacity="${f(0.75 + 0.25 * k)}" filter="url(#soft)"/></g>`;
}
const OPTS = [
  ["A · o clarão do ZH (o que está no jogo agora)", "a unidade acende na cor do time e apaga em 0,2 s; depois, só a barra diz quem está selecionado. Some no sol forte e não marca o grupo depois do clique", flash],
  ["B · os cantos do C&C (a recomendada)", "os cantos brancos fecham em volta da unidade num estalo e ficam (os mesmos do cursor de selecionar: a língua é uma só); de cima leem bem, não cobrem a unidade e não sujam o chão. O C&C de 1995, ícone da série", corners],
  ["C · o anel no chão", "o anel na cor do time deitado no chão, que nasce largo e assenta (StarCraft II, Age of Empires, Red Alert 3): o padrão do gênero, mas foi o que saiu a seu pedido em 09/10", ring],
  ["D · o contorno", "a silhueta acende na cor do time e fica fina (Age of Empires IV, Beyond All Reason): moderno, mas no jogo pede o desenho do contorno (um passe a mais da placa)", outline],
];
const page = document.getElementById("page");
page.insertAdjacentHTML("beforeend", `<h1>A resposta ao selecionar</h1><p class="sub">O que os RTS bons fazem, juntos: <b>uma marca que fica</b> no selecionado (o anel, os cantos ou o contorno), <b>uma resposta no instante do clique</b> (a voz da unidade, o canal mais forte em todos; e um estalo visual curto) e <b>o HUD que muda</b> (o cartão, que nós já temos). O ZH só pisca a unidade e fala; sem marca que fica, o grupo selecionado some no meio da batalha. Proposta: <b>B + a voz</b> (as vozes que você já tem), com o estalo da barra.</p><div class="row" id="row"></div>`);
const row = document.getElementById("row");
const svgs = [];
OPTS.forEach(([cap, note]) => {
  row.insertAdjacentHTML("beforeend", `<div class="cell"><div class="cap">${cap}</div><div class="fr"><svg width="760" height="330"><defs><radialGradient id="glow"><stop offset="0" stop-color="#59B2FF" stop-opacity=".75"/><stop offset=".6" stop-color="#59B2FF" stop-opacity=".35"/><stop offset="1" stop-color="#59B2FF" stop-opacity="0"/></radialGradient><filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter></defs><g class="g"></g></svg></div><div class="note">${note}</div></div>`);
  svgs.push(row.lastChild.querySelector(".g"));
});
function draw(t) { OPTS.forEach(([, , fn], k) => { svgs[k].innerHTML = UNITS.map(u => fn(u, t % LOOP)).join(""); }); }
if (T) draw(+T[1]); else { const t0 = performance.now(); const tick = n => { draw((n - t0) / 1000); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
</script>
</body>
</html>
