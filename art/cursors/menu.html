<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cursores do menu</title>
<style>
  :root { --AM: #E8B04A; --INK: #F2EEE6; --SH: #CFC9BD; --D: #070809; }
  html, body { margin: 0; background: transparent; }
  svg { position: absolute; overflow: visible; }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .sweep { animation: sweep 1.2s linear infinite; transform-box: view-box; transform-origin: 47px 47px; }
</style>
</head>
<body>
<!-- (01/11) Os cursores dos menus: a direção 3 escolhida ("a seta do jogo em versão de menu": a seta clara aprovada da batalha
     com o fio âmbar na borda; em cima do item, o colchete âmbar na ponta) e o resto do conjunto no mesmo traço. Grade de 64.
     #export: as quatro nas faixas de 48, 64 e 96 px, fundo transparente, pra art/tools/make_menu_cursors.py recortar -->
<script>
const NS = "http://www.w3.org/2000/svg";
const ARROW = "9,6 9,47 19.5,37.5 27,54 34,50.8 26.5,34.5 41,34.5";
const BASE = `<polygon points="${ARROW}" fill="var(--D)" stroke="var(--D)" stroke-width="5.4" stroke-linejoin="round"/>
  <polygon points="${ARROW}" fill="var(--INK)"/><polygon points="9,6 19.5,37.5 26.5,34.5 41,34.5" fill="var(--SH)"/>
  <polyline points="10.5,10 10.5,43" fill="none" stroke="var(--AM)" stroke-width="2"/>`;
const CURSORS = [
  ["menu_pointer", [9, 6], BASE],
  ["menu_hover", [9, 6], BASE + `<path d="M2 10V2H10" fill="none" stroke="var(--D)" stroke-width="5" stroke-linecap="square"/>
    <path d="M2 10V2H10" fill="none" stroke="var(--AM)" stroke-width="2.2" stroke-linecap="square"/>`],
  // escrever (o nome, o IP): o I claro com o contorno escuro e o fio âmbar no meio
  ["menu_text", [32, 32], `<path d="M25 12H39M32 12V52M25 52H39" fill="none" stroke="var(--D)" stroke-width="7.4" stroke-linecap="square"/>
    <path d="M25 12H39M32 12V52M25 52H39" fill="none" stroke="var(--INK)" stroke-width="3" stroke-linecap="square"/>
    <path d="M32 20V44" stroke="var(--AM)" stroke-width="1.2"/>`],
  // carregando: a seta com o mini radar âmbar no canto, o raio girando com o rastro de fósforo (o fundo do menu)
  ["menu_busy", [9, 6], BASE + `<circle cx="47" cy="47" r="12.5" fill="var(--D)"/><circle cx="47" cy="47" r="11" fill="#14171A"/>
    <circle cx="47" cy="47" r="8.6" fill="none" stroke="var(--AM)" stroke-opacity=".55" stroke-width="1.3"/>
    <g class="sweep"><path d="M47 47L47 38.4A8.6 8.6 0 0 1 54.4 42.7Z" fill="var(--AM)" opacity=".35"/>
    <path d="M47 47L54.4 42.7" stroke="#FFD98A" stroke-width="1.8" stroke-linecap="round"/></g>
    <circle cx="47" cy="47" r="1.6" fill="#FFD98A"/>`, 1.2],
  // arrastar (o controle do dinheiro inicial): a seta dupla clara com o ponto âmbar no meio
  ["menu_drag", [32, 32], `<g fill="var(--D)" stroke="var(--D)" stroke-width="5.4" stroke-linejoin="round"><polygon points="6,32 18,22 18,28.5 46,28.5 46,22 58,32 46,42 46,35.5 18,35.5 18,42"/></g>
    <polygon points="6,32 18,22 18,28.5 46,28.5 46,22 58,32 46,42 46,35.5 18,35.5 18,42" fill="var(--INK)"/>
    <polygon points="6,32 18,22 18,28.5 46,28.5 46,22 58,32" fill="#FFFFFF" opacity=".35"/>
    <circle cx="32" cy="32" r="3" fill="var(--AM)" stroke="var(--D)" stroke-width="1.2"/>`],
];
const BANDS = [[48, 8, "0 1px 1.3px"], [64, 72, "0 1.3px 1.7px"], [96, 152, "0 2px 2.6px"]];
// #t=0.3: tudo parado nesse instante (os quadros do carregando)
const T = /t=([\d.]+)/.exec(location.hash);
if (T) { const st = document.createElement("style"); st.textContent = `* { animation-play-state: paused !important; animation-delay: -${T[1]}s !important; }`; document.head.appendChild(st); }
const manifest = [];
CURSORS.forEach(([name, hot, inner, loop = 0], k) => {
  BANDS.forEach(([px, top, shadow]) => {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 64 64");
    s.innerHTML = inner;
    s.style.cssText = `left:${k * 112 + 8}px;top:${top}px;width:${px}px;height:${px}px;filter:drop-shadow(${shadow} rgba(0,0,0,.6))`;
    document.body.appendChild(s);
  });
  manifest.push({ name, x: k * 112 + 8, hot, loop, fps: 20, frames: loop ? Math.round(loop * 20) : 1 });
});
const pre = document.createElement("pre");
pre.id = "manifest"; pre.style.display = "none";
pre.textContent = JSON.stringify({ bands: BANDS.map(([px, top]) => ({ px, top })), cursors: manifest });
document.body.appendChild(pre);
</script>
</body>
</html>
