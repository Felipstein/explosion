<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<style>
  :root {
    --bg: #141519; --text: #e6e7ea; --sec: #8b8f9a; --ter: #5a5e69; --line: rgba(255,255,255,.06);
    --ok: #4cc38a; --wait: #d9a53a; --bad: #e5484d; --you: #9b8cff; --idle: #3f434e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 13.5px/1.4 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #2a2d35; border-radius: 8px; }
  .page { max-width: 880px; margin: 0 auto; padding: 0 28px 48px; }

  header { display: flex; align-items: center; height: 56px; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 16px; color: var(--ter); font-variant-numeric: tabular-nums; }
  header .vram { color: var(--bad); }
  body.off header h1::after { content: "  · sem ligação"; color: var(--bad); font-weight: 500; }

  .group { margin-top: 20px; }
  .group h2 { margin: 0; height: 30px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--sec); border-bottom: 1px solid var(--line); }
  .group h2 span { color: var(--ter); font-weight: 500; }
  .row { display: grid; grid-template-columns: 22px 150px 1fr auto; gap: 12px; align-items: center; min-height: 42px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row .g { width: 14px; height: 14px; display: block; }
  .row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .doing { color: var(--sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row .doing:empty::before { content: "—"; color: var(--idle); }
  .row .meta { color: var(--ter); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .meta.warn { color: var(--wait); } .row .meta.bad { color: var(--bad); } .row .meta.you { color: var(--you); }
  .row.none { color: var(--ter); }
  .row.none .name { font-weight: 400; color: var(--ter); }
  .res .name { color: var(--text); }
  .res .name em { font-style: normal; color: var(--sec); font-weight: 400; margin-right: 10px; }
  .sub { display: grid; grid-template-columns: 22px 150px 1fr; gap: 12px; align-items: baseline; min-height: 30px; padding: 4px 0 8px; border-bottom: 1px solid var(--line); color: var(--ter); font-size: 12.5px; }
  .sub .list { color: var(--sec); }
  .sub .list b { font-weight: 500; color: var(--ter); margin-right: 4px; }
  .sub .list span + span::before { content: "·"; color: var(--idle); margin: 0 8px; }
  .more { display: flex; align-items: center; gap: 12px; min-height: 36px; color: var(--ter); cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); }
  .more:hover { color: var(--sec); }
  .more .g { width: 14px; height: 14px; margin-left: 4px; }
  .quiet-list { display: none; } .quiet-list.open { display: block; }
  @media (max-width: 600px) {
    .row { grid-template-columns: 22px 1fr auto; } .row .doing { grid-column: 2 / 4; }
    .sub { grid-template-columns: 22px 1fr; } .sub .label { display: none; }
  }

  footer { margin-top: 28px; color: var(--ter); font-size: 12.5px; }
  footer .last { display: flex; gap: 12px; align-items: baseline; cursor: pointer; user-select: none; }
  footer .last:hover { color: var(--sec); }
  footer time { font-variant-numeric: tabular-nums; }
  footer ol { list-style: none; margin: 10px 0 0; padding: 0; display: none; }
  footer.open ol { display: block; }
  footer li { display: flex; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="page">
  <header><h1>Hub</h1><div class="right"><span class="vram" id="vram"></span><span id="clock"></span></div></header>
  <section class="group res" id="res"></section>
  <section class="group" id="you"></section>
  <section class="group" id="sessions"></section>
  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const G = {
  full:  (c) => `<svg class="g" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="${c}"/></svg>`,
  half:  (c) => `<svg class="g" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="${c}" stroke-width="1.5"/><path d="M7 2a5 5 0 0 1 0 10z" fill="${c}"/></svg>`,
  ring:  (c) => `<svg class="g" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`,
  check: (c) => `<svg class="g" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="${c}"/><path d="M4.4 7.2l1.9 1.9 3.5-3.8" fill="none" stroke="#141519" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  alert: (c) => `<svg class="g" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="${c}" stroke-width="1.5"/><circle cx="7" cy="7" r="2" fill="${c}"/></svg>`,
};
const C = { ok: '#4cc38a', wait: '#d9a53a', bad: '#e5484d', you: '#9b8cff', idle: '#3f434e' };
const mins = (m) => m < 60 ? `${Math.round(m)} min` : `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, '0')}`;
const ORD = (n) => `${n}º`;

/* ---- a placa e o EmberGen: uma linha cada, a fila embaixo ---- */
function resourceRows(q, label) {
  const h = q.holder, w = q.waiting || [];
  let row;
  if (q.outside_lock) {
    const o = q.outside_lock;
    row = `<div class="row">${G.alert(C.bad)}<span class="name"><em>${label}</em>${esc(o.name || o.session)}</span><span class="doing">${esc(o.task || o.text)}</span><span class="meta bad">fora da fila · ${mins(o.age_min)}</span></div>`;
  } else if (h) {
    const stale = h.touched_min > h.stale_min * 0.75;
    row = `<div class="row">${G.full(stale ? C.wait : C.ok)}<span class="name"><em>${label}</em>${esc(h.name || h.session)}</span><span class="doing" title="${esc(h.task)}">${esc(h.task)}</span><span class="meta ${stale ? 'warn' : ''}">${stale ? 'sem renovar · ' : ''}${mins(h.since_min)}</span></div>`;
  } else {
    row = `<div class="row none">${G.ring(C.idle)}<span class="name"><em>${label}</em>livre</span><span class="doing"></span><span class="meta"></span></div>`;
  }
  if (w.length) {
    row += `<div class="sub"><span></span><span class="label">${h ? 'depois' : 'na fila'}</span><span class="list">${w.map((t, i) => `<span><b>${i + 1}</b>${esc(t.name || t.session)}</span>`).join('')}</span></div>`;
  }
  return row;
}

/* ---- as sessões ---- */
function stateOf(c) {
  const st = c.status?.state;
  if (st === 'review' || st === 'blocked') return 'you';
  if (st === 'working' || c.unreal?.state === 'holding' || c.ember?.state === 'holding') return 'working';
  if (st === 'waiting' || c.unreal || c.ember) return 'waiting';
  if (!st || st === 'done') {
    if (c.idle_min != null && c.idle_min < 3) return 'working';
    if (c.idle_min == null || c.idle_min > 30) return 'quiet';
  }
  return 'idle';
}
function glyphOf(c, s) {
  const st = c.status?.state;
  if (st === 'blocked') return G.alert(C.bad);
  if (st === 'review') return G.check(C.you);
  if (st === 'done') return G.check(C.idle);
  if (s === 'working') return G.full(C.ok);
  if (s === 'waiting') return G.half(C.wait);
  return G.ring(C.idle);
}
function sessionRow(c, s) {
  const doing = c.status?.doing || c.unreal?.task || c.ember?.task || '';
  let meta = '';
  if (s === 'you' && c.status?.since_min > 10) meta = `<span class="meta you">esperando você · ${mins(c.status.since_min)}</span>`;
  else if (s === 'quiet' && c.idle_min != null) meta = `<span class="meta">${mins(c.idle_min)}</span>`;
  else meta = '<span class="meta"></span>';
  return `<div class="row">${glyphOf(c, s)}<span class="name" title="${esc(c.title)}">${esc(c.name || c.title)}</span><span class="doing" title="${esc(doing)}">${esc(doing)}</span>${meta}</div>`;
}

let quietOpen = false, footOpen = false;
function render(s) {
  const g = s.gpu;
  $('vram').textContent = g && g.mem_used / g.mem_total > 0.85 ? `placa cheia · ${(g.mem_used / 1024).toFixed(1)} / ${(g.mem_total / 1024).toFixed(0)} GB` : '';
  $('res').innerHTML = resourceRows(s.unreal, 'Placa') + resourceRows(s.ember, 'EmberGen');

  const all = (s.sessions || []).map(c => [c, stateOf(c)]);
  const you = all.filter(([, st]) => st === 'you');
  $('you').innerHTML = `<h2>Pra você <span>${you.length || ''}</span></h2>` +
    (you.length ? you.map(([c, st]) => sessionRow(c, st)).join('')
                : `<div class="row none">${G.ring(C.idle)}<span class="name">nada pra você</span><span class="doing"></span><span class="meta"></span></div>`);

  const live = all.filter(([, st]) => st === 'working' || st === 'waiting' || st === 'idle');
  const quiet = all.filter(([, st]) => st === 'quiet');
  $('sessions').innerHTML = `<h2>Sessões <span>${live.length}</span></h2>` + live.map(([c, st]) => sessionRow(c, st)).join('') +
    (quiet.length ? `<div class="more" id="more">${G.ring(C.idle)}<span>${quiet.length} ${quiet.length === 1 ? 'quieta' : 'quietas'}</span></div><div class="quiet-list ${quietOpen ? 'open' : ''}" id="quiet">${quiet.map(([c, st]) => sessionRow(c, st)).join('')}</div>` : '');
  $('more')?.addEventListener('click', () => { quietOpen = !quietOpen; $('quiet').classList.toggle('open', quietOpen); });

  const ev = s.events || [];
  const hhmm = (e) => { const d = new Date(e.t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const foot = $('foot');
  foot.innerHTML = ev.length
    ? `<div class="last"><time>${hhmm(ev[0])}</time><span>${esc(ev[0].text)}</span><span style="margin-left:auto">histórico</span></div><ol>${ev.slice(1, 30).map(e => `<li><time>${hhmm(e)}</time><span>${esc(e.text)}</span></li>`).join('')}</ol>`
    : '';
  foot.classList.toggle('open', footOpen);
  foot.querySelector('.last')?.addEventListener('click', () => { footOpen = !footOpen; foot.classList.toggle('open', footOpen); });
}

let lastOk = 0, started = null;
async function tick() {
  try {
    const s = await (await fetch('/state', { cache: 'no-store' })).json();
    if (!s.ready) return;
    if (started && s.started && s.started !== started) location.reload();   // servidor novo = página nova
    started = s.started || started;
    lastOk = Date.now();
    render(s);
    document.body.classList.remove('off');
  } catch (e) {
    if (Date.now() - lastOk > 8000) document.body.classList.add('off');
  }
}
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }, 1000);
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
