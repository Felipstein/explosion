; Qualidade das explosões por nível (o painel: baixa = 0, média = 1, alta = 3,
; ultra = 4/Cinematic). A Epic desliga os Heterogeneous Volumes em Baixo e
; Médio (BaseScalability.ini) — aqui eles ficam ligados, mais baratos: as
; explosões são o produto. Alto/Épico já marcham em meia resolução com 96/256
; passos; Cinematic em resolução cheia com 1024.

[EffectsQuality@0]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=64
r.HeterogeneousVolumes.Shadows.Resolution=128

[EffectsQuality@1]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=96
r.HeterogeneousVolumes.Shadows.Resolution=256

; Reflexos do Lumen só no ultra (Cinematic): o campo é de terra fosca (rugosidade
; 0.8–0.9) e eles custavam ~4.9 ms na 1660 (medido ao vivo, 05/10). Abaixo disso
; o reflexo vem do céu (SkyLight).
[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=0
