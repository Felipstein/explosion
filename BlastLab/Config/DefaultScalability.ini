; Qualidade das explosões por nível (o painel: baixa = 1, média = 2, alta = 3,
; ultra = 4/Cinematic). A Epic desliga os Heterogeneous Volumes em Baixo e
; Médio (BaseScalability.ini) — aqui eles ficam ligados, mais baratos: as
; explosões são o produto. Alto/Épico já marcham em meia resolução com 96/256
; passos; Cinematic em resolução cheia com 1024.

[EffectsQuality@0]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=64
r.HeterogeneousVolumes.Shadows.Resolution=128

[EffectsQuality@1]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=96
r.HeterogeneousVolumes.Shadows.Resolution=256

; alta (Épico do motor): 96 passos como no Alto (a Epic usa 256). Medido 07/10
; na morte de tanque: com 256 os volumes custavam o dobro (o limite vale pra
; marcha e pro cache de luz), e as simulações novas de 192³ chegam a ~330 passos
; na diagonal. O ultra (Cinematic) segue com 1024.
[EffectsQuality@3]
r.HeterogeneousVolumes.MaxStepCount=96

; Memória de vídeo no alta: a 1660 tem 6 GB e o orçamento da Unreal é ~5.1 GB.
; Na morte de tanque o jogo passava dele (5.7 GB na placa, ~800 MB jogados pra
; memória do sistema) e a placa ficava lenta aos trancos. Os dois maiores
; ganhos sem tocar nas explosões, com os valores do Alto da Epic: o pool de
; páginas da sombra virtual (512 → 256 MB) e o histórico do TSR em 100% da
; tela em vez de 200% (~120 → 30 MB).
[ShadowQuality@3]
r.Shadow.Virtual.MaxPhysicalPages=2048
; A sombra por campo de distância (a da luz do fogo abaixo do ultra e a do clarão) com 32
; passos em vez de 64 (11/10): à noite, com 6 Cargas Pesadas na floresta, 5,9 → 4,0 ms, sem
; diferença visível; com 20 passos (3,1 ms) as copas ganham pontinhos pretos
; (captures/ue/sombra_fogo_qualidade.jpg). O ultra (Cine) segue com 64.
r.DFShadowQuality=2

; a média (o Alto do motor): o mesmo
[ShadowQuality@2]
r.DFShadowQuality=2

[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=100

; e o atlas da cena do Lumen no tamanho do Alto (4096 → 3584, ~115 MB): com a
; câmera perto da morte de tanque ainda faltavam ~40 MB (aviso de memória
; esgotada na rodada ab_close_depois de 07/10)
[GlobalIlluminationQuality@3]
r.LumenScene.SurfaceCache.AtlasSize=3584

