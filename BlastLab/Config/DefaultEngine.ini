[SystemSettings]
; Explosões (Heterogeneous Volume): ler o volume no ponto exato da marcha, com
; a interpolação trilinear da textura — como o WebGL. O padrão (3) sorteia um
; voxel vizinho com pesos de B-spline cúbica (HeterogeneousVolumesStochastic-
; Filtering.ush), um filtro que aproxima em vez de interpolar: somado ao
; trilinear da leitura, borrava a bola de fogo e deixava grão (A/B de
; 04/10/2026) e ainda custava mais.
r.HeterogeneousVolumes.StochasticFiltering=0
; O raio da marcha é cortado a 300 m por padrão: de longe (zoom até 800 m) as
; explosões sumiriam, e a caixa da nuclear sozinha tem 342 m.
r.HeterogeneousVolumes.MaxTraceDistance=200000
r.HeterogeneousVolumes.MaxShadowTraceDistance=200000
; A luz do céu nos volumes (o termo skyCol do WebGL): a indireta do Lumen
; (volume de GI da translucidez, já com a oclusão do próprio volume) no cache de
; luz. Até 07/10 era 0.175, o termo do WebGL (céu/π × 1.1 × fase isotrópica).
; Agora 1 (o físico, o mesmo céu que o chão recebe): com 0.175 a fumaça recebia
; 5.7× menos céu que o chão e a sombra dela saía marrom (matiz 22°, sat. 0.34)
; enquanto a do tanque é fria; com 1 ela fica neutra, na luminância da sombra do
; tanque (estudo da sessão de arte; A/B em captures/ue/_ab_sky_0175_vs_1.jpg). O
; cinza-arroxeado que o 1 dava vinha do espalhamento múltiplo sem o albedo
; (corrigido no material: oitavas × ω, MsAlbedo).
r.HeterogeneousVolumes.IndirectLighting=1
r.HeterogeneousVolumes.IndirectLighting.Mode=1
; A exposição aqui é física (EV100 ~14.6 às 15h, até ~18 escurecendo no clarão,
; ~−1.3 na noite de lua). O cache de luz do Lumen e da captura do céu guarda a
; luz pré-exposta numa faixa fixa: o padrão (4) cobre [−8, 12] e cortava o dia
; (aviso na tela, cena escura ao vivo). 9 cobre [−3, 17]
; (PostProcessEyeAdaptation.cpp: '8 ... fully covers physically based lighting range').
r.EyeAdaptation.CachedLightingPreExposure=9
; espalhamento múltiplo do céu com 64 direções em vez de 2: o fator por hora
; (Tools/sky_ms_table.py) foi calculado contra o Hillaire de 48 direções
r.SkyAtmosphere.MultiScatteringLUT.HighQuality=1
; Nanite Foliage (experimental, 5.7+): as árvores das fatias do WorldForge
; (Procedural Vegetation Editor) são "assemblies", o tronco + milhares de
; raminhos instanciados; sem isto a Unreal desenha só o tronco
r.Nanite.Foliage=1
; o terreno e as árvores (malhas comuns) enchem a fila de marcação das sombras
; virtuais: o aviso amarelo na tela não muda a sombra (o mesmo do WorldForge)
r.Shadow.Virtual.AllowScreenOverflowMessages=0

