<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jogadores no HUD v2</title>
<style>
/* 02/11, v2 (a v1 reprovada: o placar sujo e sem respiro, a lista lateral, as caixinhas das superarmas, o relógio recortado). Regras do
   estudo (docs/concept/hud/JOGADORES.md): corpo >= 20 px, números 22 px com dígitos de largura igual, rótulos 15 px uma vez só, linha de
   36 px, times separados por respiro de 26 px (sem traço nem caixa), no máximo 7 colunas, informação escondida = vazio com um olho só,
   na tela de jogo nada de caixa (texto com sombra). */
@font-face { font-family: Barlow; src: url(a/BarlowSemiCondensed-Medium.ttf); font-weight: 500; }
@font-face { font-family: Barlow; src: url(a/BarlowSemiCondensed-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Barlow; src: url(a/BarlowSemiCondensed-Bold.ttf); font-weight: 700; }
html, body { margin: 0; height: 100%; background: #07090b; overflow: hidden; font-family: Barlow, sans-serif; color: #e9eef4; }
#wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 1920px; height: 1080px; flex: none; overflow: hidden; transform-origin: center; }
#scene { position: absolute; inset: 0; background: url(a/scene_teams.jpg) 0 0 / 1920px 1080px; }
.f-china #scene { background-image: url(a/china/scene_teams.jpg); }
.f-gla #scene { background-image: url(a/gla/scene_teams.jpg); }
.f-russia #scene { background-image: url(a/russia/scene_teams.jpg); }

/* a barra de cima do protótipo (não é HUD) */
#bar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
  background: rgba(4,6,8,.92); border-bottom: 1px solid #1d2733; z-index: 100; font: 600 14px Barlow; }
#bar b { color: #8fa3b8; font-weight: 600; margin: 0 6px 0 10px; }
#bar button { font: 700 13px Barlow; color: #cfd8e2; background: #121a24; border: 1px solid #2a3644; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
#bar button.on { background: #1d4f80; color: #fff; border-color: #49aaff; }
#bar .mc { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid #2a3644; }
#bar .mc.on { border-color: #fff; box-shadow: 0 0 0 2px #49aaff; }
#bar .hint { margin-left: auto; color: #8fa3b8; font-weight: 500; }

/* ---- a barra do topo: a do duelo; com mais jogadores, os painéis alongam (estica só a faixa lisa do meio deles) ---- */
#top { position: absolute; left: 0; top: 44px; width: 1920px; height: 114px; z-index: 10; }
#top canvas { position: absolute; top: 0; }
.ov { position: absolute; transform: translate(-50%, -50%); }
.clock { font: 700 34px Barlow; letter-spacing: .5px; color: #e9eef4; text-shadow: 0 1px 2px #000; }
.pname { font: 700 22px Barlow; text-shadow: 0 1px 2px #000; white-space: nowrap; }
.ringnum { font: 700 30px Barlow; color: #ff7c6c; text-shadow: 0 1px 2px #000; }
.swring { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
.swring.ready { animation: pulse 1s ease-in-out infinite; }
.swtag { position: absolute; transform: translate(-50%, -50%); padding: 1px 6px; border-radius: 8px; background: rgba(6,9,12,.88); box-shadow: inset 0 0 0 1px rgba(255,210,87,.35);
  font: 700 13px Barlow; font-variant-numeric: tabular-nums; color: #ffe08a; white-space: nowrap; cursor: default; }
.swtag.hot { color: #ff8a7a; box-shadow: inset 0 0 0 1px rgba(255,80,60,.6); }
.swtag.ready { background: #c8281b; color: #fff; box-shadow: none; animation: pulse 1s ease-in-out infinite; }
/* a linha do tempo: de agora (esquerda) até 5 min (direita); cada superarma é a ficha do dono no ponto do tempo que falta */
#swt { position: absolute; left: 50%; top: 176px; transform: translateX(-50%); width: 620px; height: 70px; z-index: 9; display: none; }
.time #swt { display: block; }
.time #sw { display: none; }
#swt .track { position: absolute; left: 0; right: 0; top: 14px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,74,58,.9), rgba(255,210,87,.75) 20%, rgba(255,255,255,.25)); box-shadow: 0 1px 4px rgba(0,0,0,.8); }
#swt .tk { position: absolute; top: 22px; transform: translateX(-50%); font: 700 12px Barlow; color: rgba(235,240,245,.75); text-shadow: 0 1px 2px #000; }
#swt .mk { position: absolute; transform: translate(-50%, -50%); }
#swt .mk .chip { position: relative; transform: none; display: block; }
#swt .mk.ready .chip { box-shadow: 0 0 0 2px #ff4a3a, 0 0 10px #ff4a3a; animation: pulse 1s ease-in-out infinite; }
/* 03/11, 2ª volta (as faixas coloridas: "parece jogo de criança"): a lista na direita feita com a peça aprovada do HUD, a caixinha
   de superarma da facção (o metal, os parafusos, as ripas), recortada em 9 partes. A cor do dono só na ficha dele; a carga na fileira de
   células, a linguagem da energia do console (âmbar carregando, vermelho no último minuto, pronta = todas vermelhas piscando). */
#swl { position: absolute; right: 20px; top: 166px; width: 300px; z-index: 9; display: flex; flex-direction: column; gap: 3px; }
.swb { position: relative; display: flex; align-items: center; gap: 9px; height: 46px; box-sizing: border-box; padding: 0 6px; cursor: default;
  border-style: solid; border-width: 8px 22px; border-image: url(a/sw_box.png) 12 34 fill / 8px 22px stretch; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.f-china .swb { border-width: 8px 24px; border-image: url(a/china/sw_box.png) 10 34 fill / 8px 24px stretch; }   /* a da China cortada no corpo (a arte tinha um resto em cima) */
.f-gla .swb { border-image-source: url(a/gla/sw_box.png); }
.f-russia .swb { border-width: 8px 36px; border-image: url(a/russia/sw_box.png) 12 58 fill / 8px 36px stretch; }
.swb.c { height: 36px; }
.swb .chip { position: relative; transform: none; flex: none; width: 24px; height: 24px; }
.swb.c .chip { width: 20px; height: 20px; }
.swb .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.swb .nm { font: 600 13px Barlow; letter-spacing: 1.4px; text-transform: uppercase; color: #dde4ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
.swb.c .nm { font-size: 12px; }
.swb .cells { display: flex; gap: 2px; height: 5px; }
.swb.c .cells { height: 4px; }
.swb .cells i { flex: 1; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.swb .cells i.on { background: linear-gradient(#ffe7a3, #e2a93a); box-shadow: 0 0 4px rgba(246,200,80,.55); }
.swb.hot .cells i.on { background: linear-gradient(#ffb3a8, #ff3b2c); box-shadow: 0 0 5px rgba(255,59,44,.7); }
.swb.ready .cells i { background: linear-gradient(#ffb3a8, #ff3b2c); box-shadow: 0 0 6px rgba(255,59,44,.85); animation: blinkc .8s steps(2) infinite; }
@keyframes blinkc { 50% { opacity: .35; } }
.swb .tt { flex: none; min-width: 44px; text-align: right; font: 700 19px Barlow; font-variant-numeric: tabular-nums; color: #f1f4f7; text-shadow: 0 1px 2px #000; }
.swb.c .tt { font-size: 16px; }
.swb.hot .tt { color: #ff8070; }
.swb.ready .tt { color: #ff5a48; font-size: 14px; letter-spacing: 1.5px; }
.swl-more { align-self: flex-end; font: 600 13px Barlow; color: #aab6c3; text-shadow: 0 1px 2px #000; padding-right: 8px; }
.allyline { position: absolute; height: 3px; border-radius: 2px; background: #8fc6ff; box-shadow: 0 0 6px rgba(143,198,255,.7); }
.more { position: absolute; transform: translateY(-50%); font: 700 16px Barlow; color: #cfd8e2; text-shadow: 0 1px 2px #000; }

/* a ficha: o encaixe escuro, o aro na cor do jogador e a silhueta na cor dele (clareada pra ler no escuro) */
.chip { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: #0b0f14; box-shadow: 0 0 0 2px var(--c), 0 0 5px rgba(0,0,0,.85); cursor: default; }
.chip i { position: absolute; inset: 16%; background: var(--g); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.chip.dead { box-shadow: 0 0 0 2px #3a3f45; }
.chip.dead i { background: #4a5058; }
.chip.dead::after { content: ''; position: absolute; inset: 22%; background: url(a/defeated_x.png) center / contain no-repeat; opacity: .9; }
.tip { position: absolute; z-index: 60; pointer-events: none; padding: 7px 11px; background: rgba(6,9,12,.94); border-radius: 4px; font: 600 16px Barlow; white-space: nowrap; display: none; }
.tip small { display: block; font: 600 14px Barlow; color: #f2d16b; margin-top: 2px; }

/* ---- as superarmas: o timer do Zero Hour modernizado. Sem caixa: o nome na cor do dono e o tempo, com sombra, os dois-pontos numa
   coluna; uma linha por jogador (a mais próxima dele), no máximo 4, no canto de cima à direita ---- */
/* 03/11 (ele: o texto puro "regressão, horrorosa, parece que copiamos o C&C"): um medalhão por superarma, em fileira no canto de cima à
   direita, logo abaixo da barra. O desenho da arma no centro; o anel na cor do dono enche conforme ela carrega; o tempo numa plaquinha
   embaixo. No último minuto o anel e a plaquinha ficam vermelhos; pronta, o medalhão pulsa. A arma e o dono aparecem no mouse. */
#sw { position: absolute; right: 26px; top: 168px; z-index: 9; display: flex; gap: 14px; align-items: flex-start; }
.med { position: relative; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: default; }
.med svg.ring { width: 66px; height: 66px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.75)); }
.med .core { position: absolute; left: 9px; top: 9px; width: 48px; height: 48px; border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #1c2836, #0a0f15 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -6px 10px rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center; }
.med .core svg { width: 28px; height: 28px; }
.med .tm { min-width: 46px; padding: 2px 8px; border-radius: 10px; background: rgba(6,9,12,.86); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  font: 700 16px Barlow; font-variant-numeric: tabular-nums; color: #eef2f6; text-align: center; letter-spacing: .5px; }
.med.soon .tm { color: #ff8a7a; box-shadow: inset 0 0 0 1px rgba(255,80,60,.5); }
.med.ready .tm { background: #c8281b; color: #fff; box-shadow: none; }
.med.ready svg.ring { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { filter: drop-shadow(0 0 10px rgba(255,70,50,.95)); } }
.swmore { align-self: center; margin-top: -18px; width: 40px; height: 40px; border-radius: 50%; background: rgba(6,9,12,.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center; font: 700 15px Barlow; color: #cfd8e2; }

/* ---- o placar (Tab): a janela da tela de poderes de cada facção, por dentro limpo ---- */
#back { position: absolute; inset: 0; background: rgba(2,4,7,.6); opacity: 0; pointer-events: none; z-index: 45; transition: opacity .12s; }
#score { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -48%); width: 1180px; box-sizing: border-box; z-index: 50; display: none;
  padding: 34px 44px 36px; border: 0; background: url(a/gen_bg.png) repeat; }
#score::before { content: ''; position: absolute; pointer-events: none; z-index: 1; inset: calc(-1 * var(--ft)) calc(-1 * var(--fr)) calc(-1 * var(--fb)) calc(-1 * var(--fl));
  background: url(a/gen_frame.png) 0 0 / 100% 100% no-repeat; }
#score::after { content: ''; position: absolute; inset: 0; background: rgba(4,6,9,.45); pointer-events: none; }
#score > * { position: relative; z-index: 2; }
.f-usa #score { --ft: 14.7px; --fb: 11.5px; --fl: 14.1px; --fr: 12.8px; }
.f-china #score { --ft: 20.5px; --fb: 20.5px; --fl: 29.4px; --fr: 29.4px; background-image: url(a/china/gen_bg.png); }
.f-china #score::before { background-image: url(a/china/gen_frame.png); }
.f-gla #score { --ft: 22.4px; --fb: 20.5px; --fl: 25px; --fr: 24.3px; background-image: url(a/gla/gen_bg.png); }
.f-gla #score::before { background-image: url(a/gla/gen_frame.png); }
.f-russia #score { --ft: 20.5px; --fb: 19.2px; --fl: 17.9px; --fr: 17.9px; background-image: url(a/russia/gen_bg.png); }
.f-russia #score::before { background-image: url(a/russia/gen_frame.png); }
.tabon #score { display: block; }
.tabon #back { opacity: 1; }
#score .hd { display: flex; align-items: baseline; gap: 18px; margin-bottom: 22px; }
#score h2 { margin: 0; font: 700 28px Barlow; letter-spacing: 3px; }
#score .sub { font: 600 17px Barlow; color: #9aa9b8; }
#score .sub b { color: #e9eef4; }
.grid { display: flex; flex-direction: column; }
/* 03/11 (ele: "cada linha com uma cor diferente, tipo as pastas do Mac, UI bonita"): cada jogador é uma faixa arredondada no tom da cor
   dele (forte à esquerda, sumindo pra direita), com a beira na cor; respiro de 4 px entre faixas e de 22 px entre times */
.tb { display: flex; gap: 10px; }
.tb + .tb { margin-top: 22px; }
.tlab { width: 30px; flex: none; padding-top: 8px; font: 700 24px Barlow; color: rgba(200,212,224,.3); text-align: center; }
.tlab.mine { color: rgba(143,198,255,.8); }
.rows { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 96px 150px 104px 118px 128px 60px; column-gap: 14px; align-items: center; padding: 0 16px; }
.hdr { margin-bottom: 6px; }
.lab { font: 600 15px Barlow; letter-spacing: 1.5px; color: rgba(200,212,224,.6); text-transform: uppercase; white-space: nowrap; }
.lab.r { text-align: right; }
.prow { height: 42px; border-radius: 9px; background: linear-gradient(90deg, rgb(var(--rc) / .36), rgb(var(--rc) / .13) 38%, rgb(var(--rc) / .05) 100%);
  box-shadow: inset 4px 0 0 rgb(var(--rc) / .95), inset 0 0 0 1px rgb(var(--rc) / .14); }
.prow.dead { background: rgba(120,130,140,.07); box-shadow: inset 4px 0 0 rgba(120,130,140,.35); }
.prow.dead > * { opacity: .5; }
.pl { display: flex; align-items: center; gap: 10px; position: relative; min-width: 0; }
.pl .chip { position: relative; transform: none; flex: none; width: 26px; height: 26px; }
.pl img { width: 24px; height: 24px; flex: none; }
.pl b { font: 600 20px Barlow; color: #f4f7fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .spyb { width: 24px; height: 24px; flex: none; margin-left: 2px; }
.pl .you { font: 700 12px Barlow; letter-spacing: 1px; color: #0b0f14; background: #cfe3f5; border-radius: 4px; padding: 1px 5px; }
.num { font: 600 22px Barlow; font-variant-numeric: tabular-nums; color: #f4f7fa; text-align: right; white-space: nowrap; }
.num small { font-size: 16px; color: rgba(220,228,236,.6); }
.num.spy { color: #ffc27a; }
.hidden { grid-column: span 3; display: flex; justify-content: center; opacity: .5; }
.hidden svg { width: 22px; height: 22px; }
.pw { display: flex; justify-content: flex-end; }
.pw svg { width: 16px; height: 20px; }
.gone { grid-column: span 6; font: 600 16px Barlow; color: #9aa6b2; text-align: right; letter-spacing: 1.5px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage" class="f-usa">
  <div id="scene"></div>
  <div id="bar">
    <b>FORMATO</b>
    <button data-s="duel">1 × 1</button><button data-s="2v2">2 × 2</button><button data-s="3v5">3 × 5</button><button data-s="8v8">8 × 8</button>
    <button data-s="ffa6">Todos × todos (6)</button><button data-s="ffa16">Todos × todos (16)</button><button data-s="4x4">4 times de 4</button><button data-s="3v5v8">3 × 5 × 8</button>
    <b>FACÇÃO</b>
    <button data-f="usa">USA</button><button data-f="china">China</button><button data-f="gla">GLA</button><button data-f="russia">Rússia</button>
    <b>MINHA COR</b><span id="mcs"></span>
    <span class="hint">segure TAB: o placar · mouse nas fichas: o nome</span>
  </div>
  <div id="top"><canvas id="cv" width="1920" height="114"></canvas><div id="ovs"></div></div>
  <div id="sw"></div><div id="swt"></div><div id="swl"></div>
  <div id="back"></div>
  <div id="score"><div class="hd"><h2>SCOREBOARD</h2><span class="sub"></span></div><div class="grid"></div></div>
  <div class="tip" id="tip"></div>
</div></div>
<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${k})`; }
addEventListener('resize', fit); fit();

const COLORS = ['#4d8fe0', '#e0443a', '#3cb043', '#e6c629', '#f08a24', '#a46ce0', '#25b8c8', '#e65aa6', '#d9dde3', '#b07a44', '#1f9e86', '#9ad13a', '#c43fd1', '#5b7fd6', '#c9a24a', '#8a96a2'];
const FACS = ['usa', 'china', 'gla', 'russia'];
const NAMES = ['Felipe', 'Bruno', 'Caio', 'Davi', 'Edu', 'Fabio', 'Gui', 'Hugo', 'Igor', 'Joao', 'Kaue', 'Leo', 'Marco', 'Nina', 'Otto', 'Paulo'];
const SWN = { usa: 'Orbital Lance', china: 'Nuclear Missile', gla: 'Plague Storm', russia: 'Thermobaric Strike' };
const SCEN = { duel: [1, 1], '2v2': [2, 2], '3v5': [3, 5], '8v8': [8, 8], ffa6: [1, 1, 1, 1, 1, 1], ffa16: Array(16).fill(1), '4x4': [4, 4, 4, 4], '3v5v8': [3, 5, 8] };
const LABEL = { duel: '1 vs 1', '2v2': '2 vs 2', '3v5': '3 vs 5', '8v8': '8 vs 8', ffa6: 'Free for all', ffa16: 'Free for all', '4x4': '4 teams of 4', '3v5v8': '3 vs 5 vs 8' };
let FAC = 'usa', SC = '3v5', MYCOL = null, SWM = 'list';
function rnd(i, k) { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); }
// a cor do jogador clareada pra texto e silhueta (o azul e o roxo puros não passam no contraste)
function light(hex, k = 0.4) { const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(v + (255 - v) * k)); return `rgb(${c})`; }
const rgbOf = hex => { const n = parseInt(hex.slice(1), 16); return `${n >> 16} ${n >> 8 & 255} ${n & 255}`; };
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const kfmt = v => v >= 10000 ? (v / 1000).toFixed(1).replace('.0', '') + 'k' : v.toLocaleString('en-US');
const army = v => (v / 1000).toFixed(1).replace('.0', '') + 'k';   // o exército sempre no mesmo formato

function makePlayers(sizes) {
  const P = []; let n = 0;
  sizes.forEach((sz, t) => { for (let j = 0; j < sz; j++, n++) {
    const p = { i: n, team: t, name: n === 0 ? 'Felipe' : (rnd(n, 2) < 0.3 ? `Hard AI ${n}` : NAMES[n % 16]), fac: n === 0 ? FAC : FACS[Math.floor(rnd(n, 1) * 4)],
      col: COLORS[n % 16], me: n === 0, ally: t === 0 && n > 0, dead: n > 0 && rnd(n, 3) < 0.12, spied: t !== 0 && rnd(n, 4) < 0.18,
      rank: 1 + Math.floor(rnd(n, 5) * 5), score: Math.round(800 + rnd(n, 6) * 5200), money: Math.round(300 + rnd(n, 8) * 9000),
      income: Math.round(200 + rnd(n, 9) * 1300), army: Math.round(1000 + rnd(n, 10) * 22000), lost: Math.floor(rnd(n, 11) * 40),
      kills: Math.floor(rnd(n, 12) * 60), sw: rnd(n, 13) < 0.55 ? Math.round(rnd(n, 14) < 0.15 ? 0 : 20 + rnd(n, 14) * 420) : null };
    p.pm = 60 + Math.round(rnd(n, 15) * 100); p.pu = Math.round(p.pm * (0.6 + rnd(n, 16) * 0.55));
    if (p.dead) p.sw = null;
    P.push(p);
  } });
  if (MYCOL) { const o = P.find(p => p.col === MYCOL); if (o && o !== P[0]) o.col = P[0].col; P[0].col = MYCOL; }
  return P;
}
const dir = () => FAC === 'usa' ? '' : FAC + '/';
const chipHTML = (p, x, y, d) => `<span class="chip ${p.dead ? 'dead' : ''}" data-i="${p.i}" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;--c:${p.col};--g:${light(p.col, .25)};--m:url(a/glyph_${p.fac}.png)"><i></i></span>`;

// ---- a barra do topo, composta no canvas a partir da arte do duelo (1307 × 200 com as margens) ----
const BARN = new Image(), LME = new Image(), LFOE = new Image(), BARC = document.createElement('canvas'); let barFac = '';
// a camada de um painel pintada numa cor (a cor do jogador acende o vidro: a escura sobe até um brilho mínimo, como no HUD)
function glowHex(hex) { const n = parseInt(hex.slice(1), 16); let c = [n >> 16, n >> 8 & 255, n & 255]; const m = Math.max(...c); if (m < 178) c = c.map(v => Math.round(v * 178 / m)); return `rgb(${c})`; }
function tintLayer(im, col) { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const g = c.getContext('2d');
  g.drawImage(im, 0, 0); g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(im, 0, 0); return c; }
function compose() { BARC.width = BARN.width; BARC.height = BARN.height; const g = BARC.getContext('2d'); g.clearRect(0, 0, BARC.width, BARC.height);
  g.drawImage(BARN, 0, 0); g.drawImage(tintLayer(LME, glowHex(P[0].col)), 0, 0); g.drawImage(tintLayer(LFOE, glowHex(SC === 'duel' ? P[1].col : '#e0443a')), 0, 0); }
const K = 742 / 1307;                      // a escala do topo 1x1 aprovado
const u = v => (110 + v);                  // unidade da peça (0..1087) -> coluna da imagem com a margem
// os cortes: a ponta esquerda com o anel e o começo do painel | a faixa lisa do painel (estica) | o fim do painel | o relógio | ...
const CUT = { lfix: [-110, 170], lmid: [240, 244], ltip: [370, 430], clock: [430, 657], rtip: [657, 717], rmid: [843, 847], rfix: [917, 1197] };
const W = k => (CUT[k][1] - CUT[k][0]) * K;

let P = [];
// 03/11 (ele: "esse desbalanceamento não vai funcionar"; o 2 × 2 equilibrado "fica perfeito"): a barra é sempre simétrica.
// - duelo e dois times: o painel da esquerda (azul) é o seu time, o da direita (vermelho) o outro; os dois com o comprimento do maior.
// - três ou mais times e todos contra todos: os painéis em vidro neutro e as fichas divididas por igual entre os dois lados: o seu time
//   colado em você (com o traço azul embaixo), depois os times inimigos, cada time separado por um respiro.
function drawTop() {
  const cv = $('#cv'), g = cv.getContext('2d'); g.clearRect(0, 0, 1920, 114);
  const ov = []; const teams = SCEN[SC].length;
  const at = {}; const chipAt = (p, x, y, d) => { at[p.i] = [x, y, d]; return chipHTML(p, x, y, d); };
  const cy = 68 * K;
  const me = P[0], allies = P.filter(p => p.ally), enemies = P.filter(p => !p.me && !p.ally);
  const duel = SC === 'duel', many = teams > 2;
  const D = 28, GAP = 6, TGAP = 14;
  const groups = []; for (let t = 1; t < teams; t++) groups.push(enemies.filter(p => p.team === t));
  // o que vai em cada painel: listas de grupos (um grupo = um time)
  let leftGroups, rightGroups;
  if (duel) { leftGroups = []; rightGroups = []; }
  else if (!many) { leftGroups = allies.length ? [allies] : []; rightGroups = groups; }
  else {
    // a fila inteira: o seu time primeiro, depois os inimigos time a time; corta no meio (o lado esquerdo fica com a metade de baixo)
    const seq = []; allies.forEach(p => seq.push([p, 0])); groups.forEach((gr, gi) => gr.forEach(p => seq.push([p, gi + 1])));
    const half = Math.ceil(seq.length / 2);
    const toGroups = arr => { const out = []; let cur = null, key = null; arr.forEach(([p, k]) => { if (k !== key) { cur = []; out.push(cur); key = k; } cur.push(p); }); return out; };
    leftGroups = toGroups(seq.slice(0, half)); rightGroups = toGroups(seq.slice(half));
  }
  const span = gs => gs.reduce((a, gr) => a + gr.length * D + Math.max(0, gr.length - 1) * GAP, 0) + Math.max(0, gs.length - 1) * TGAP;
  const leftNeed = span(leftGroups), rightNeed = span(rightGroups);
  const baseL = (CUT.lmid[0] - CUT.lfix[1] + CUT.ltip[0] - CUT.lmid[1]) * K;   // o painel sem esticar
  const need = Math.max(leftNeed, rightNeed);
  const lStretch = Math.max(0, need + 40 - (baseL + W('lmid') + 60 * K)) + (CUT.lmid[1] - CUT.lmid[0]) * K;
  const rStretch = lStretch;
  const segs = [['lfix'], ['lmidA'], ['lmid', lStretch], ['lmidB'], ['ltip'], ['clock'], ['rtip'], ['rmidA'], ['rmid', rStretch], ['rmidB'], ['rfix']];
  CUT.lmidA = [CUT.lfix[1], CUT.lmid[0]]; CUT.lmidB = [CUT.lmid[1], CUT.ltip[0]];
  CUT.rmidA = [CUT.rtip[1], CUT.rmid[0]]; CUT.rmidB = [CUT.rmid[1], CUT.rfix[0]];
  const widths = segs.map(([k, w]) => w !== undefined ? w : W(k));
  const leftW = widths.slice(0, 5).reduce((a, b) => a + b, 0);
  let x = 960 - W('clock') / 2 - leftW;
  const pos = {}, img = many ? BARN : BARC;
  segs.forEach(([k], i) => { const [a, b] = CUT[k]; pos[k] = x;
    g.drawImage(img, u(a), 0, b - a, 200, x, 0, widths[i] + 0.6, 114); x += widths[i]; });
  const ringL = pos.lfix + (u(83) - u(-110)) * K, ringR = pos.rfix + (1006 - 917) * K;
  const pL0 = pos.lfix + (150 + 110) * K, pL1 = pos.ltip + 30 * K, pR0 = pos.rtip + 30 * K, pR1 = pos.rfix + (937 - 917) * K;
  ov.push(chipAt(me, ringL, cy, 40));
  ov.push(`<div class="ov clock" style="left:960px;top:${cy}px">12:34</div>`);
  const place = (gs, c0, c1, need) => {
    let cx = (c0 + c1) / 2 - need / 2 + D / 2;
    gs.forEach(gr => {
      const x0 = cx;
      gr.forEach(p => { ov.push(chipAt(p, cx, cy, D)); cx += D + GAP; });
      if (many && gr[0].ally) ov.push(`<div class="allyline" style="left:${x0 - D / 2}px;width:${cx - GAP - x0}px;top:${cy + D / 2 + 4}px;background:${light(me.col, .3)};box-shadow:0 0 6px ${me.col}"></div>`);
      cx += TGAP - GAP;
    });
  };
  if (duel) {
    const foe = P[1];
    ov.push(`<div class="ov pname" style="left:${(pL0 + pL1) / 2}px;top:${cy}px;color:${light(me.col)}">${me.name}</div>`);
    ov.push(`<div class="ov pname" style="left:${(pR0 + pR1) / 2}px;top:${cy}px;color:${light(foe.col)}">${foe.name}</div>`);
    ov.push(chipAt(foe, ringR, cy, 40));
  } else {
    if (leftGroups.length) place(leftGroups, pL0, pL1, leftNeed);
    else ov.push(`<div class="ov pname" style="left:${(pL0 + pL1) / 2}px;top:${cy}px;color:${light(me.col)}">${me.name}</div>`);
    place(rightGroups, pR0, pR1, rightNeed);
    ov.push(`<div class="ov ringnum" style="left:${ringR}px;top:${cy}px">${enemies.filter(p => !p.dead).length}</div>`);
  }
  // as superarmas na ficha: o anel de carga em volta da ficha do dono e o tempo numa plaquinha embaixo da barra
  // os tempos embaixo da barra: só nos últimos 2 min (e o READY); o anel de carga aparece em todos. Se dois se encostam, o de depois desce
  const tags = [];
  if (SWM === 'chip') P.forEach(p => {
    if (p.me || p.sw === null || p.dead || !at[p.i]) return;
    const [x, y, d] = at[p.i], R = d / 2 + 5, C = 2 * Math.PI * R, f = p.sw === 0 ? 1 : Math.max(0.05, 1 - p.sw / 600), hot = p.sw < 60;
    ov.push(`<svg class="swring ${p.sw === 0 ? 'ready' : ''}" style="left:${x}px;top:${y}px;width:${2 * R + 6}px;height:${2 * R + 6}px" viewBox="0 0 ${2 * R + 6} ${2 * R + 6}">`
      + `<circle cx="${R + 3}" cy="${R + 3}" r="${R}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="3.5"/>`
      + `<circle cx="${R + 3}" cy="${R + 3}" r="${R}" fill="none" stroke="${hot ? '#ff4a3a' : '#ffd257'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(C * f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${R + 3} ${R + 3})"/></svg>`);
    if (p.sw < 120) tags.push([x, p]);
  });
  const rowEnd = [];
  tags.sort((a, b) => a[0] - b[0]).forEach(([x, p]) => {
    const w = p.sw === 0 ? 52 : 40; let row = 0;
    while (rowEnd[row] !== undefined && x - w / 2 < rowEnd[row] + 3) row++;
    rowEnd[row] = x + w / 2;
    ov.push(`<div class="swtag ${p.sw === 0 ? 'ready' : p.sw < 60 ? 'hot' : ''}" data-i="${p.i}" data-sw="1" style="left:${x}px;top:${86 + row * 21}px">${p.sw === 0 ? 'READY' : fmt(p.sw)}</div>`);
  });
  $('#ovs').innerHTML = ov.join('');
}

function render() {
  stage.className = 'f-' + FAC;
  P = makePlayers(SCEN[SC]);
  const src = `a/${dir()}bar_duel.png`;
  if (barFac !== FAC) { barFac = FAC; let n = 0; const done = () => { if (++n === 3) { compose(); drawTop(); } };
    [BARN, LME, LFOE].forEach(im => im.onload = done); BARN.src = `a/${dir()}bar_neutral.png`; LME.src = `a/${dir()}bar_me.png`; LFOE.src = `a/${dir()}bar_foe.png`; }
  else { compose(); drawTop(); }

  // as superarmas: a mais próxima de cada jogador, em ordem de tempo, no máximo 4
  const sw = P.filter(p => p.sw !== null && !p.me).sort((a, b) => a.sw - b.sw);
  const show = sw.slice(0, SC === 'duel' ? 1 : 4);
  // os desenhos das armas (vetor): o feixe orbital, o trevo nuclear, o risco biológico, a chama termobárica
  const tre = () => { const r = Math.PI / 180, pt = (ang, rad) => `${(12 + rad * Math.cos(ang * r)).toFixed(2)},${(12 + rad * Math.sin(ang * r)).toFixed(2)}`;
    return [-90, 30, 150].map(an => `<path d="M${pt(an - 30, 4)} L${pt(an - 30, 10)} A10 10 0 0 1 ${pt(an + 30, 10)} L${pt(an + 30, 4)} A4 4 0 0 0 ${pt(an - 30, 4)}Z" fill="#eef2f6"/>`).join(''); };
  const GLYPH = {
    usa: '<svg viewBox="0 0 24 24" fill="none" stroke="#eef2f6" stroke-width="2" stroke-linecap="round"><path d="M12 2v11"/><path d="M8 5l4-3 4 3"/><circle cx="12" cy="17" r="3.2"/><path d="M5 21l2.5-2M19 21l-2.5-2M12 22v-1.5"/></svg>',
    china: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2" fill="#eef2f6"/>${tre()}</svg>`,
    gla: '<svg viewBox="0 0 24 24" fill="none" stroke="#eef2f6" stroke-width="2"><circle cx="12" cy="7.5" r="4.2"/><circle cx="7.8" cy="14.8" r="4.2"/><circle cx="16.2" cy="14.8" r="4.2"/><circle cx="12" cy="12.4" r="1.6" fill="#eef2f6"/></svg>',
    russia: '<svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6.5 6 12a6 6 0 0 1-12 0c0-3 1.6-4.6 3-6 .3 2 1 3 2.2 3.6C11 9 11 5.5 12 2z" fill="#eef2f6"/></svg>' };
  const FULL = 600;   // o tempo inteiro de carga (s), só pro anel
  const medal = p => {
    const f = p.sw === 0 ? 1 : Math.max(0.04, 1 - p.sw / FULL), R = 29, C = 2 * Math.PI * R, soon = p.sw > 0 && p.sw < 60;
    const col = p.sw === 0 || soon ? '#ff4a3a' : p.col;
    return `<div class="med ${p.sw === 0 ? 'ready' : soon ? 'soon' : ''}" data-i="${p.i}" data-sw="1"><svg class="ring" viewBox="0 0 66 66"><circle cx="33" cy="33" r="${R}" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="6"/>`
      + `<circle cx="33" cy="33" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C * f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 33 33)"/></svg>`
      + `<div class="core">${GLYPH[p.fac]}</div><div class="tm">${p.sw === 0 ? 'READY' : fmt(p.sw)}</div></div>`;
  };
  // 03/11: os medalhões no canto reprovados ("se aparecer um monte não consigo ver os restantes"). Duas formas de ver TODAS:
  // na ficha (o anel de carga na ficha de cada jogador na barra) ou a linha do tempo (de agora até 5 min, a ficha do dono no ponto)
  $('#sw').innerHTML = '';
  const all = P.filter(p => p.sw !== null && !p.me && !p.dead).sort((a, b) => a.sw - b.sw);
  const TW = 620, rowsEnd = [];
  let t = [0, 1, 2, 3, 4, 5].map(m => `<span class="tk" style="left:${m / 5 * TW}px">${m === 0 ? 'NOW' : m + ':00'}</span>`).join('') + '<div class="track"></div>';
  all.forEach(p => {
    const x = Math.min(1, p.sw / 300) * TW; let row = 0;
    while (rowsEnd[row] !== undefined && x - rowsEnd[row] < 26) row++;
    rowsEnd[row] = x;
    t += `<div class="mk ${p.sw === 0 ? 'ready' : ''}" data-i="${p.i}" data-sw="1" style="left:${x}px;top:${16 - row * 26 + (row ? -6 : 0)}px">${chipHTML(p, 0, 0, 22).replace(/left:0px;top:0px;/, '')}</div>`;
  });
  $('#swt').innerHTML = t;
  // a lista na direita: todas as superarmas dos outros, a mais próxima em cima (mais de 6: as caixas afinam; até 12, o resto no Tab)
  const L = P.filter(p => p.sw !== null && !p.me && !p.dead).sort((x, y) => x.sw - y.sw);
  const compact = L.length > 6, shown = L.slice(0, 12);
  $('#swl').innerHTML = SWM !== 'list' ? '' : shown.map(p => {
    const f = p.sw === 0 ? 1 : Math.max(0, 1 - p.sw / 600), on = Math.round(f * 12), hot = p.sw > 0 && p.sw < 60;
    const cells = Array.from({ length: 12 }, (_, k) => `<i class="${k < on ? 'on' : ''}"></i>`).join('');
    return `<div class="swb ${compact ? 'c' : ''} ${p.sw === 0 ? 'ready' : hot ? 'hot' : ''}" data-i="${p.i}" data-sw="1">${chipHTML(p, 0, 0, 24).replace(/left:0px;top:0px;width:24px;height:24px;/, '')}`
      + `<div class="mid"><span class="nm">${SWN[p.fac]}</span><span class="cells">${cells}</span></div><span class="tt">${p.sw === 0 ? 'READY' : fmt(p.sw)}</span></div>`;
  }).join('') + (L.length > shown.length ? `<div class="swl-more">+${L.length - shown.length} · TAB</div>` : '');
  stage.classList.toggle('time', SWM === 'time');

  // o placar: o seu time primeiro, os outros pela pontuação; um bloco por time, separado por respiro
  const teams = SCEN[SC].length;
  const rankIcon = p => p.fac === 'usa' ? `rank_usa_${p.rank}.png` : `${p.fac}/rank_${p.fac}_${p.rank}.png`;
  const eye = `<svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z" fill="none" stroke="#c8d4e0" stroke-width="1.8"/><path d="M4 20 20 4" stroke="#c8d4e0" stroke-width="1.8"/></svg>`;
  const bolt = c => `<svg viewBox="0 0 10 12"><path d="M6 0 1 7h3l-1 5 6-8H6l1-4z" fill="${c}"/></svg>`;
  const rgb = hex => { const n = parseInt(hex.slice(1), 16); return `${n >> 16} ${n >> 8 & 255} ${n & 255}`; };
  let s = `<div class="tb"><div class="tlab"></div><div class="rows"><div class="cols hdr"><div class="lab">Player</div><div class="lab r">Score</div><div class="lab r">Destroyed / Lost</div><div class="lab r">Army</div><div class="lab r">Money</div><div class="lab r">Income / min</div><div class="lab r">Power</div></div></div></div>`;
  // o seu time primeiro; os outros pela pontuação, e os times já derrotados por último
  const tScore = t => P.filter(p => p.team === t).reduce((x, p) => x + p.score, 0), tDead = t => P.filter(p => p.team === t).every(p => p.dead);
  const order = [0, ...[...Array(teams).keys()].slice(1).sort((a, b) => (tDead(a) - tDead(b)) || (tScore(b) - tScore(a)))];
  const ffa = SC.startsWith('ffa');
  const rowHTML = p => {
    const open = p.me || p.ally, spied = p.spied && !p.dead;
    const ch = `<span class="chip ${p.dead ? 'dead' : ''}" data-i="${p.i}" style="--c:${p.col};--g:${light(p.col, .25)};--m:url(a/glyph_${p.fac}.png)"><i></i></span>`;
    const name = `<div class="pl">${ch}<img src="a/${rankIcon(p)}" alt=""><b>${p.name}</b>${p.me ? '<span class="you">YOU</span>' : ''}${spied ? '<img class="spyb" src="a/spy_badge_eye.png" alt="">' : ''}</div>`;
    if (p.dead) return `<div class="cols prow dead">${name}<div class="gone">DEFEATED</div></div>`;
    const kd = `<div class="num">${p.kills} <small>/ ${p.lost}</small></div>`;
    const powc = p.pu > p.pm ? '#ff3b2c' : p.pm - p.pu < p.pm * 0.1 ? '#ffd23a' : '#4fd36a';
    const eco = open || spied
      ? `<div class="num ${spied ? 'spy' : ''}">${army(p.army)}</div><div class="num ${spied ? 'spy' : ''}">$${kfmt(p.money)}</div><div class="num ${spied ? 'spy' : ''}">+${kfmt(p.income)}</div><div class="pw">${bolt(powc)}</div>`
      : `<div class="hidden">${eye}</div><div></div>`;
    return `<div class="cols prow" style="--rc:${rgb(p.col)}">${name}<div class="num">${p.score.toLocaleString('en-US')}</div>${kd}${eco}</div>`;
  };
  if (ffa) {
    // todos contra todos: uma lista só, você em cima e os outros pela pontuação, os derrotados no fim
    const list = P.slice().sort((a, b) => (b.me - a.me) || (a.dead - b.dead) || (b.score - a.score));
    s += `<div class="tb"><div class="tlab"></div><div class="rows">${list.map(rowHTML).join('')}</div></div>`;
  } else order.forEach(t => {
    const list = P.filter(p => p.team === t).sort((a, b) => (b.me - a.me) || (a.dead - b.dead) || (b.score - a.score));
    s += `<div class="tb"><div class="tlab ${t === 0 ? 'mine' : ''}">${t + 1}</div><div class="rows">${list.map(rowHTML).join('')}</div></div>`;
  });
  $('#score .grid').innerHTML = s;
  $('#score .sub').innerHTML = `${LABEL[SC]} · <b>${P.length} players</b> · <b>12:34</b>`;
  document.querySelectorAll('#bar [data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === SC));
  document.querySelectorAll('#bar [data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === FAC));
  document.querySelectorAll('#bar [data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === SWM));
  document.querySelectorAll('#bar [data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === (MYCOL || COLORS[0])));
}
document.querySelectorAll('#bar [data-s]').forEach(b => b.addEventListener('click', () => { SC = b.dataset.s; render(); }));
document.querySelectorAll('#bar [data-f]').forEach(b => b.addEventListener('click', () => { FAC = b.dataset.f; render(); }));
document.querySelectorAll('#bar [data-w]').forEach(b => b.addEventListener('click', () => { SWM = b.dataset.w; render(); }));
$('#mcs').innerHTML = COLORS.slice(0, 8).map(c => `<button class="mc" data-c="${c}" style="background:${c}"></button>`).join('');
document.querySelectorAll('#bar [data-c]').forEach(b => b.addEventListener('click', () => { MYCOL = b.dataset.c; render(); }));
addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); stage.classList.add('tabon'); } });
addEventListener('keyup', e => { if (e.key === 'Tab') stage.classList.remove('tabon'); });
// o mouse na ficha: o nome; nos aliados, o dinheiro e a energia
const tip = $('#tip');
stage.addEventListener('mousemove', e => {
  const c = e.target.closest('[data-i]'); if (!c || stage.classList.contains('tabon')) { tip.style.display = 'none'; return; }
  const p = P[+c.dataset.i], r = stage.getBoundingClientRect(), k = r.width / 1920;
  tip.innerHTML = `${c.dataset.sw ? SWN[p.fac] + ' · ' + (p.sw === 0 ? 'READY' : fmt(p.sw)) + ' · ' : ''}<span style="color:${light(p.col, .35)}">${p.name}</span>${p.me ? ' (you)' : ''}${p.dead ? ' · defeated' : ''}${p.ally && !p.dead ? `<small>$${p.money.toLocaleString('en-US')} · power ${p.pu}/${p.pm}</small>` : ''}`;
  tip.style.display = 'block'; tip.style.left = ((e.clientX - r.left) / k + 14) + 'px'; tip.style.top = ((e.clientY - r.top) / k + 18) + 'px';
});
const q = new URLSearchParams(location.search);
if (q.get('s')) SC = q.get('s'); if (q.get('fac')) FAC = q.get('fac'); if (q.get('me')) MYCOL = '#' + q.get('me'); if (q.get('sw')) SWM = q.get('sw');
render();
if (q.get('tab')) stage.classList.add('tabon');
