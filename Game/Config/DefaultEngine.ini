; Configuração do jogo. Render igual ao WorldForge/BlastLab pra GTX 1660 (Turing
; sem núcleos de RT): DirectX 12, Lumen por software, sombras virtuais, TSR.

[/Script/EngineSettings.GameMapsSettings]
; o jogo abre direto no menu, com o mapa do deserto ao fundo (como o ShellMap do Zero Hour)
EditorStartupMap=/Game/Maps/World_TestSalt2.World_TestSalt2
GameDefaultMap=/Game/Maps/World_TestSalt2.World_TestSalt2
GlobalDefaultGameMode=/Script/RTSGame.RTSMenuGameMode
GameInstanceClass=/Script/Engine.GameInstance

[CoreRedirects]
; o mapa veio do WorldForge e aponta pro modo de jogo dele; aqui vira o menu
+ClassRedirects=(OldName="/Script/WorldForge.ForgeSliceGameMode",NewName="/Script/RTSGame.RTSMenuGameMode")
; as gravações das explosões vêm do BlastLab (Game/Source/BlastFx é a cópia do código delas)
+ClassRedirects=(OldName="/Script/BlastLab.ExplosionBake",NewName="/Script/BlastFx.ExplosionBake")

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
r.AllowStaticLighting=False
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.Nanite.Foliage=1
; a silhueta da unidade atrás de prédio (13/10): a profundidade das unidades com o dono no stencil
r.CustomDepth=3
; sem desfoque de movimento, como o WebGL e o BlastLab: na câmera de cima ele borra o mapa ao rolar
r.DefaultFeature.MotionBlur=False

[SystemSettings]
; exposição física de dia (EV100 ~15, sol de 120 mil lux): sem isto a luz guardada
; do Lumen e da captura do céu é cortada e as sombras saem pretas (WorldForge, 05/10)
r.EyeAdaptation.CachedLightingPreExposure=8
r.Shadow.Virtual.AllowScreenOverflowMessages=0
; As explosões (Heterogeneous Volume) com os ajustes aprovados no BlastLab (BlastLab/Config/
; DefaultEngine.ini, com os porquês): leitura trilinear sem o filtro estocástico (o padrão
; deixava a bola granulada), marcha até 2 km, e o céu do Lumen no cache de luz do volume
; (sem ele a sombra da fumaça saía marrom).
r.HeterogeneousVolumes.StochasticFiltering=0
r.HeterogeneousVolumes.MaxTraceDistance=200000
r.HeterogeneousVolumes.MaxShadowTraceDistance=200000
r.HeterogeneousVolumes.IndirectLighting=1
r.HeterogeneousVolumes.IndirectLighting.Mode=1

[/Script/Engine.Engine]
; sem a mensagem "LIGHTING NEEDS TO BE REBUILT" (o mapa é todo dinâmico)
bSuppressMapWarnings=True

