; Presets do jogo (Baixa/Média/Alta/Ultra = níveis 1/2/3/4 da Unreal, como no
; BlastLab). Juntei as correções medidas no WorldForge e no BlastLab.

; Explosões por nível (BlastLab/Config/DefaultScalability.ini): a Epic desliga os
; Heterogeneous Volumes em Baixo e Médio; aqui eles ficam, mais baratos (as explosões
; são o produto). No Épico (o alta do jogo) 96 passos: com 256 os volumes custavam o
; dobro (BlastLab, 07/10).
[EffectsQuality@0]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=64
r.HeterogeneousVolumes.Shadows.Resolution=128

[EffectsQuality@1]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=96
r.HeterogeneousVolumes.Shadows.Resolution=256

[EffectsQuality@3]
r.HeterogeneousVolumes.MaxStepCount=96

; Baixa com sombra do sol: o nível 0 da Unreal desliga as sombras e, da câmera
; de RTS, relevo e mata viram recorte de papel (WorldForge, 06/10: 10,1 → 11,3 ms).
[ShadowQuality@0]
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.05
r.Shadow.DistanceScale=0.7
r.Shadow.CSM.TransitionScale=0.25
r.CapsuleShadows=1
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=4

; Memória de vídeo no alta (1660, 6 GB): pool da sombra virtual e histórico do
; TSR no tamanho do Alto da Epic (BlastLab, 07/10: 5,7 → 5,1 GB na morte de tanque).
[ShadowQuality@3]
r.Shadow.Virtual.MaxPhysicalPages=2048
; A sombra do sol uma resolução mais grossa no alta (16/10, a escolha do Felipe pelo lado a lado da água: "ligue no
; alta"): o padrão da Epic é -1,5; a -0,5 a cena chao cai de 33,0 pra 32,2 ms, e a borda da sombra na água fica um
; pouco mais riscada só no ampliado (captures/game/agua_lado_a_lado.jpg). O ultra segue no padrão.
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=100

[GlobalIlluminationQuality@3]
r.LumenScene.SurfaceCache.AtlasSize=3584

; O chão que afunda de verdade (13/10: o deslocamento Nanite do Landscape, a cratera e o
; sulco da esteira em geometria) só no alta e no ultra; nos menores a tesselação sai
; inteira, porque ela custa mesmo com o deslocamento zerado (o DispOn do material).
[ShadingQuality@0]
r.Nanite.Tessellation=0

[ShadingQuality@1]
r.Nanite.Tessellation=0

[ShadingQuality@2]
r.Nanite.Tessellation=0

[ShadingQuality@3]
r.Nanite.Tessellation=1

[ShadingQuality@Cine]
r.Nanite.Tessellation=1

; Reflexos do Lumen só no ultra: o chão é fosco e eles custavam ~4,9 ms na 1660.
[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=0
