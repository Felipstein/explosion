; Presets do WorldForge (Baixa/Média/Alta/Ultra = níveis 0–3 da Unreal).
;
; Baixa com sombra do sol: o nível 0 da Unreal desliga as sombras
; (r.ShadowQuality=0) e, da câmera de RTS, a mata e o relevo viravam recorte
; de papel. Aqui o nível 0 de sombra recebe os valores do nível 1
; (BaseScalability.ini, [ShadowQuality@1]). Custo medido em 06/10 no mapa
; inteiro da floresta, vista de jogo a 190 m: 10,1 → 11,3 ms
; (captures/worldforge/low_shadow_ab.jpg). Sobrescrito aqui, e não com
; sg.ShadowQuality por fora: o preset continua "Baixa" inteiro e o painel
; e a volta da qualidade real leem o nível certo.

[ShadowQuality@0]
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.05
r.Shadow.DistanceScale=0.7
r.Shadow.CSM.TransitionScale=0.25
r.CapsuleShadows=1
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=4
