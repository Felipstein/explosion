; Teclas do WorldForge: F1 esconde o painel, F2 liga o teste de qualidade,
; F3 mostra os grupos de triângulos do Nanite. A Unreal usa F1–F5 como
; atalhos de depuração nas versões de desenvolvimento (BaseInput.ini:
; F1 wireframe, F2 "unlit" — sem sol nem sombra —, F3 lit, F4 detail
; lighting, F5 shader complexity), e eles disparavam junto com os nossos.

